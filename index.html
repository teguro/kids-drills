<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドリルランド</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff8e7; color: #333; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: 34px; margin: 12px 0 4px; }
  p.sub { font-size: 17px; color: #777; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  a.btn { display: block; padding: 26px 8px; border-radius: 18px; text-decoration: none; color: #fff; font-size: 26px; font-weight: bold; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  a.btn:active { transform: translateY(3px); box-shadow: none; }
  .kanji { background: #e4572e; }
  .kokugo { background: #2e9e5b; }
  .sansuu { background: #2e7de4; }
  .shakai { background: #b06ab3; }
  .rika { background: #00a3a3; }
  .eigo { background: #f2a007; }
  .small { display: block; font-size: 14px; font-weight: normal; margin-top: 6px; opacity: .9; }
  .hidden { display: none; }

  /* ---- PINゲート（GATE.md 参照） ---- */
  .pin-card { background: #fff; border-radius: 18px; padding: 20px 16px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 8px; }
  .pin-dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #bbb; background: transparent; }
  .pin-dot.on { background: #e4572e; border-color: #e4572e; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 12px auto 0; }
  .pin-key { font-family: inherit; font-size: 28px; font-weight: bold; padding: 16px 0; border: none; border-radius: 16px; background: #fdf1dc; color: #333; box-shadow: 0 3px 0 rgba(0,0,0,.12); cursor: pointer; }
  .pin-key:active { transform: translateY(2px); box-shadow: none; background: #f7e3c2; }
  .pin-msg { min-height: 26px; font-size: 17px; font-weight: bold; color: #d33; margin: 10px 0 0; }
  .lock-btn { margin-top: 28px; font-family: inherit; font-size: 15px; font-weight: bold; padding: 10px 24px; border: none; border-radius: 12px; background: #ddd6c4; color: #666; box-shadow: 0 3px 0 rgba(0,0,0,.12); cursor: pointer; }
  .lock-btn:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ PINゲート（未開錠のときだけ表示） ============ -->
  <div id="gate-view" class="hidden">
    <h1>ドリルランド</h1>
    <p class="sub">あんしょうばんごうを いれてね</p>
    <div class="pin-card">
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p class="pin-msg" id="pin-msg"></p>
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" type="button" data-k="1">1</button>
        <button class="pin-key" type="button" data-k="2">2</button>
        <button class="pin-key" type="button" data-k="3">3</button>
        <button class="pin-key" type="button" data-k="4">4</button>
        <button class="pin-key" type="button" data-k="5">5</button>
        <button class="pin-key" type="button" data-k="6">6</button>
        <button class="pin-key" type="button" data-k="7">7</button>
        <button class="pin-key" type="button" data-k="8">8</button>
        <button class="pin-key" type="button" data-k="9">9</button>
        <button class="pin-key" type="button" data-k="c">けす</button>
        <button class="pin-key" type="button" data-k="0">0</button>
        <button class="pin-key" type="button" data-k="b">←</button>
      </div>
    </div>
  </div>

  <!-- ============ メニュー（開錠後に表示） ============ -->
  <div id="menu-view" class="hidden">
    <h1>ドリルランド</h1>
    <p class="sub">やりたい ドリルを えらんでね</p>
    <div class="grid">
      <a class="btn kanji" href="kanji.html">かんじ<span class="small">1〜4ねんせい</span></a>
      <a class="btn kokugo" href="kokugo.html">こくご<span class="small">ことばの ドリル</span></a>
      <a class="btn sansuu" href="sansuu.html">さんすう<span class="small">1・4ねんせい</span></a>
      <a class="btn shakai" href="shakai.html">しゃかい<span class="small">4ねんせい</span></a>
      <a class="btn rika" href="rika.html">りか<span class="small">4ねんせい</span></a>
      <a class="btn eigo" href="eigo.html">えいご<span class="small">1・4ねんせい</span></a>
    </div>
    <a href="kiroku.html" style="display:block;margin-top:18px;padding:18px;border-radius:18px;background:#555;color:#fff;text-decoration:none;font-size:22px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.15);">きろくを みる<span style="display:block;font-size:14px;font-weight:normal;margin-top:4px;opacity:.9;">そういちろう・つづみの がんばり</span></a>
    <a href="bird.html" style="display:block;margin-top:14px;padding:18px;border-radius:18px;background:#8a5a2b;color:#fff;text-decoration:none;font-size:22px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.15);">バード<span style="display:block;font-size:14px;font-weight:normal;margin-top:4px;opacity:.9;">おうち つうか の かんり</span></a>
    <a href="message.html" style="display:block;margin-top:14px;padding:18px;border-radius:18px;background:#e4572e;color:#fff;text-decoration:none;font-size:22px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.15);">✉️ ママから<span style="display:block;font-size:14px;font-weight:normal;margin-top:4px;opacity:.9;">ママからの メッセージ</span></a>
    <button class="lock-btn" id="lock-btn" type="button">🔒 ロックする</button>
  </div>

</div>

<script>
'use strict';
/* ============================================================
   ドリルランド PINゲート（入口）。くわしくは GATE.md。
   LAND_PIN は公開前に実値へ一括置換する（プレースホルダの間は開錠できない）。
   開錠状態は localStorage の land_unlock_v1（=開錠した日付）に保存し、
   その日のうちだけ有効（翌日は再入力）。
   ============================================================ */
var LAND_PIN = '2002';
var LAND_PAGES = ['kanji.html', 'kokugo.html', 'sansuu.html', 'shakai.html', 'rika.html', 'eigo.html', 'kiroku.html', 'bird.html', 'message.html'];

var $ = function (id) { return document.getElementById(id); };

function landToday() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function landIsUnlocked() {
  try { return localStorage.getItem('land_unlock_v1') === landToday(); }
  catch (e) { return false; }
}

function landGetNext() {
  var q = location.search.replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split('=');
    if (kv[0] === 'next') {
      var v = decodeURIComponent(kv[1] || '');
      return LAND_PAGES.indexOf(v) >= 0 ? v : null;
    }
  }
  return null;
}

function showView(name) {
  $('gate-view').classList.toggle('hidden', name !== 'gate');
  $('menu-view').classList.toggle('hidden', name !== 'menu');
}

/* ---------- PINパッド ---------- */
var pinBuf = '';

function updatePinDots() {
  var dots = $('pin-dots').children;
  for (var i = 0; i < 4; i++) dots[i].classList.toggle('on', i < pinBuf.length);
}

function unlock() {
  try { localStorage.setItem('land_unlock_v1', landToday()); } catch (e) {}
  var next = landGetNext();
  if (next) { location.replace(next); }
  else { showView('menu'); }
}

function pinKey(k) {
  if (k === 'c') { pinBuf = ''; }
  else if (k === 'b') { pinBuf = pinBuf.slice(0, -1); }
  else if (pinBuf.length < 4) { pinBuf += k; }
  $('pin-msg').textContent = '';
  updatePinDots();
  if (pinBuf.length === 4) {
    if (pinBuf === LAND_PIN) {
      unlock();
    } else {
      pinBuf = '';
      updatePinDots();
      $('pin-msg').textContent = 'あんしょうばんごうが ちがうみたい';
    }
  }
}

$('pin-pad').addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-k]');
  if (btn) pinKey(btn.getAttribute('data-k'));
});

$('lock-btn').addEventListener('click', function () {
  try { localStorage.removeItem('land_unlock_v1'); } catch (e) {}
  location.replace('index.html');
});

/* ---------- 初期表示 ---------- */
(function init() {
  var next = landGetNext();
  if (landIsUnlocked()) {
    if (next) { location.replace(next); return; }
    showView('menu');
  } else {
    showView('gate');
  }
  updatePinDots();
})();
</script>
</body>
</html>
