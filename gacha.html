<script>
/* ===== ドリルランド PINゲート（そとがわチェック） =====
   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=gacha.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261127-6";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff8e7; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 44px; }

  .gacha-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .gacha-btn:disabled { background: #ccc; box-shadow: 0 5px 0 rgba(0,0,0,.1); cursor: default; }

  .reveal { background: #fff; border-radius: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 18px; text-align: center; margin: 6px 0 18px; }

  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 5px rgba(0,0,0,.07); padding: 10px 6px 12px; text-align: center; position: relative; }
  .card .c-name { font-size: 16px; font-weight: bold; margin-top: 6px; }
  .card .c-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; display: block; }
  .reveal .r-photo { width: min(300px, 100%); aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; margin-top: 8px; }
  .card .c-size { font-size: 11px; color: #999; }
  .card.locked { opacity: .45; filter: grayscale(1); }
  .card .cnt { position: absolute; top: 6px; right: 6px; background: #2e7de4; color: #fff; font-size: 12px; font-weight: bold; border-radius: 999px; padding: 1px 8px; }

  a.back { display: block; margin: 30px auto 0; max-width: 320px; text-align: center; padding: 16px; border-radius: 16px; background: #2e9e5b; color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }

<script>
  var BIRDS = [
    { name: "スズメ", size: "約14cm", rarity: 1, w: 24, img: "sparrow.jpg", fact: "ほっぺの 黒い もようが めじるし。いちばん 身近な とり。" },
    { name: "シジュウカラ", size: "約15cm", rarity: 1, w: 22, img: "shijukara.jpg", fact: "胸の 黒い ネクタイもようが おしゃれ。ことばを つかう 研究でも 有名。" },
    { name: "モズ", size: "約20cm", rarity: 1, w: 20, img: "mozu.jpg", fact: "つかまえた 虫を 枝に さす「はやにえ」で 有名な ハンター。" },
    { name: "メジロ", size: "約12cm", rarity: 1, w: 20, img: "mejiro.jpg", fact: "目の まわりの 白い わっかが めじるし。花の みつが 大好き。" },
    { name: "ヒヨドリ", size: "約28cm", rarity: 1, w: 20, img: "hiyodori.jpg", fact: "ピーヨ！と 大きな 声で 鳴く。少し 茶色い ほっぺが あるよ。" },
    { name: "ツバメ", size: "約17cm", rarity: 1, w: 20, img: "tsubame.jpg", fact: "尾が 二つに わかれた 燕尾服（えんびふく）スタイル。春に やってくる。" },
    { name: "エナガ", size: "約14cm", rarity: 1, w: 19, img: "enaga.jpg", fact: "尾が 長くて 体は まんまる。白くて ふわふわの 小さな とり。" },
    { name: "ハクセキレイ", size: "約21cm", rarity: 1, w: 18, img: "hakusekirei.jpg", fact: "尾を 上下に ふりながら 地面を 歩く。白と 黒の もよう。" },
    { name: "コゲラ", size: "約15cm", rarity: 1, w: 18, img: "kogera.jpg", fact: "日本で いちばん 小さい キツツキ。木を コツコツ つつく。" },
    { name: "ウミネコ", size: "約44cm", rarity: 1, w: 18, img: "umineko.jpg", fact: "ニャーと 猫みたいに 鳴く カモメの なかま。海辺に 多い。" },
    { name: "コアジサシ", size: "約24cm", rarity: 1, w: 17, img: "koajisashi.jpg", fact: "海の 上から まっすぐ 水に 飛びこんで 魚を とる。" },
    { name: "ハマシギ", size: "約21cm", rarity: 1, w: 17, img: "hamashigi.jpg", fact: "干潟（ひがた）で むれを 作る。小さい シギの なかま。" },
    { name: "メダイチドリ", size: "約19cm", rarity: 1, w: 17, img: "medaichidori.jpg", fact: "目が 大きい チドリ。浜辺を ちょこちょこ 走る。" },
    { name: "ムナグロ", size: "約24cm", rarity: 1, w: 17, img: "munaguro.jpg", fact: "胸が 黒くて 背中は 金色っぽい。旅鳥（たびどり）として やってくる。" },
    { name: "ツミ", size: "約27cm", rarity: 2, w: 12, img: "tsumi.jpg", fact: "日本で いちばん 小さい タカの なかま。オスは もっと 小さいよ。" },
    { name: "カワセミ", size: "約17cm", rarity: 2, w: 10, img: "kawasemi.jpg", fact: "水辺の 宝石。青い 背中と オレンジの お腹で、ダイビングして 魚を とる。" },
    { name: "ノスリ", size: "約55cm", rarity: 2, w: 10, img: "nosuri.jpg", fact: "空を ゆっくり 輪を 描いて 飛ぶ タカ。ピイーと 鳴く。" },
    { name: "ハイタカ", size: "約35cm", rarity: 2, w: 9, img: "haitaka.jpg", fact: "森の 中を すばやく 飛んで、小鳥を つかまえる。" },
    { name: "サシバ", size: "約50cm", rarity: 2, w: 8, img: "sashiba.jpg", fact: "春と 秋に むれで 渡りを する タカ。ピックイーと 鳴く。" },
    { name: "チョウゲンボウ", size: "約35cm", rarity: 2, w: 8, img: "chougenbou.jpg", fact: "空に 静止（ホバリング）して ねずみを ねらう、小さな ハヤブサの なかま。" },
    { name: "フクロウ", size: "約50cm", rarity: 2, w: 8, img: "fukurou.jpg", fact: "ゴロスケホーホーと 鳴く 夜の ハンター。首が ぐるりと 回る。" },
    { name: "アオバズク", size: "約29cm", rarity: 2, w: 7, img: "aobazuku.jpg", fact: "ホッホーと 鳴く 夏の フクロウ。黄色い 目が 大きい。" },
    { name: "オオタカ", size: "約55cm", rarity: 2, w: 6, img: "ootaka.jpg", fact: "速くて 賢い ハンター。白い まゆげ もようが りりしい。" },
    { name: "ウミスズメ", size: "約26cm", rarity: 2, w: 6, img: "umisuzume.jpg", fact: "海で 泳いで 魚を とる 小さな とり。数が へって 心配されている。" },
    { name: "クマタカ", size: "約75cm", rarity: 3, w: 4, img: "kumataka.jpg", fact: "森の 大きな 猛禽。頭の 後ろの 冠羽（かんう）が かっこいい。" },
    { name: "ハヤブサ", size: "約45cm", rarity: 3, w: 3, img: "hayabusa.jpg", fact: "世界で いちばん 速い とり。急降下は 時速300キロを こえる！" },
    { name: "イヌワシ", size: "約85cm", rarity: 3, w: 2, img: "inuwashi.jpg", fact: "空の 王さま。大きな 翼で ゆうゆうと 飛ぶ。" },
    { name: "チゴハヤブサ", size: "約31cm", rarity: 3, w: 2, img: "chigohayabusa.jpg", fact: "空を 高速で 飛んで、ツバメや 虫を つかまえる 小さな ハヤブサ。" },
    { name: "トラフズク", size: "約38cm", rarity: 3, w: 2, img: "torafuzuku.jpg", fact: "長い 耳羽（みみばね）と オレンジの 目。冬に むれで 木に とまる。" },
    { name: "オオワシ", size: "約95cm", rarity: 3, w: 1, img: "oowashi.jpg", fact: "日本で 見られる いちばん 大きな ワシ。冬に 北海道へ やってくる。" }
  ];
  var GACHA_KEY = "kidsdrills_gacha_v1";
  var currentPlayer = null;
  try {
    var lp = localStorage.getItem("kidsdrills_last_player");
    if (lp === "soichiro" || lp === "tsuzumi") currentPlayer = lp;
  } catch (e) {}
  if (!currentPlayer) currentPlayer = "soichiro";

  function birdPhoto(b, cls) {
    return '<img class="' + cls + '" src="bird-assets/' + b.img + '" alt="' + b.name + '">';
  }
  function loadGacha() {
    try {
      var g = JSON.parse(localStorage.getItem(GACHA_KEY) || "{}");
      return (g && typeof g === "object") ? g : {};
    } catch (e) { return {}; }
  }
  function myGacha() {
    var g = loadGacha();
    if (!g[currentPlayer] || typeof g[currentPlayer] !== "object") g[currentPlayer] = { spent: 0, birds: {} };
    if (typeof g[currentPlayer].spent !== "number") g[currentPlayer].spent = 0;
    if (!g[currentPlayer].birds || typeof g[currentPlayer].birds !== "object") g[currentPlayer].birds = {};
    return g;
  }
  function totals() {
    var rec = {};
    try { rec = JSON.parse(localStorage.getItem("kidsdrills_records_v1") || "{}"); } catch (e) {}
    var mine = rec[currentPlayer] || {};
    var plays = 0, seconds = 0;
    ["kanji", "kokugo", "sansuu", "shakai", "rika", "eigo"].forEach(function (k) {
      var r = mine[k];
      if (r) { plays += (r.plays || 0); seconds += (r.seconds || 0); }
    });
    return { plays: plays, seconds: seconds };
  }
  function earned() {
    var t = totals();
    return Math.floor(t.plays / 5) + Math.floor(t.seconds / 1800);
  }
  function render() {
    document.getElementById("player-soichiro").className = "player-btn" + (currentPlayer === "soichiro" ? " sel-soichiro" : "");
    document.getElementById("player-tsuzumi").className = "player-btn" + (currentPlayer === "tsuzumi" ? " sel-tsuzumi" : "");
    var g = myGacha();
    var left = earned() - g[currentPlayer].spent;
    if (left < 0) left = 0;
    document.getElementById("ticket-num").textContent = left;
    var t = totals();
    document.getElementById("ticket-detail").textContent =
      "ドリル " + t.plays + "かい ／ じかん " + Math.floor(t.seconds / 60) + "ふん がんばったよ。"
      + "（5かいで 1まい、30ふんで 1まい たまるよ）";
    document.getElementById("gacha-btn").disabled = left <= 0;
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    var owned = 0;
    BIRDS.forEach(function (b) {
      var cnt = g[currentPlayer].birds[b.name] || 0;
      if (cnt > 0) owned++;
      var div = document.createElement("div");
      div.className = "card" + (cnt > 0 ? "" : " locked");
      div.innerHTML = (cnt > 1 ? '<span class="cnt">×' + cnt + '</span>' : "")
        + birdPhoto(b, "c-photo")
        + '<div class="c-name">' + (cnt > 0 ? b.name : "？？？") + '</div>'
        + '<div class="c-size">' + (cnt > 0 ? b.size : "まだ みつけてない") + '</div>';
      grid.appendChild(div);
    });
    document.getElementById("col-count").textContent = owned;
    document.getElementById("complete").classList.toggle("hidden", owned < BIRDS.length);
  }
  function draw() {
    var totalW = 0;
    BIRDS.forEach(function (b) { totalW += b.w; });
    var r = Math.random() * totalW;
    for (var i = 0; i < BIRDS.length; i++) {
      r -= BIRDS[i].w;
      if (r <= 0) return BIRDS[i];
    }
    return BIRDS[0];
  }
  document.getElementById("gacha-btn").addEventListener("click", function () {
    var g = myGacha();
    if (earned() - g[currentPlayer].spent <= 0) return;
    var btn = document.getElementById("gacha-btn");
    var cap = document.getElementById("capsule");
    var reveal = document.getElementById("reveal");
    btn.disabled = true;
    reveal.classList.add("hidden");
    cap.textContent = "🎁";
    cap.classList.add("spin");
    setTimeout(function () {
      cap.classList.remove("spin");
      cap.textContent = "🐣";
      var b = draw();
      var isNew = !g[currentPlayer].birds[b.name];
      g[currentPlayer].birds[b.name] = (g[currentPlayer].birds[b.name] || 0) + 1;
      g[currentPlayer].spent += 1;
      try { localStorage.setItem(GACHA_KEY, JSON.stringify(g)); } catch (e) {}
      var stars = b.rarity === 3 ? "★★★ スーパーレア！" : (b.rarity === 2 ? "★★ レア" : "★ ノーマル");
      reveal.innerHTML = (isNew ? '<span class="new">あたらしい！</span>' : "")
        + '<div class="rarity">' + stars + '</div>'
        + birdPhoto(b, "r-photo")
        + '<div class="bird-name">' + b.name + '</div>'
        + '<div class="bird-fact">大きさ： ' + b.size + '<br>' + b.fact + '</div>';
      reveal.classList.remove("hidden");
      render();
    }, 900);
  });
  ["soichiro", "tsuzumi"].forEach(function (p) {
    document.getElementById("player-" + p).addEventListener("click", function () {
      currentPlayer = p;
      try { localStorage.setItem("kidsdrills_last_player", p); } catch (e) {}
      document.getElementById("reveal").classList.add("hidden");
      document.getElementById("capsule").textContent = "🪺";
      render();
    });
  });
  render();
</script>
</body>
