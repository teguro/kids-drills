<script>
/* ===== ドリルランド PINゲート（そとがわチェック） =====
   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=help.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261127-3";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<script>
'use strict';
/* ============================================================
   エンドポイントURL（Apps Script ウェブアプリの /exec URL）
   連絡先（FaceTime宛先）はページに書かず、PIN照合OKのときだけ
   サーバー（action=contacts）から受け取ってボタンを作る。
   ============================================================ */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyurtmUMcRCv2MmyBu96IlMEbBIpReYApm1QwtaI52hEh1JWn_fK4BrMhHgDkhszmZIBg/exec';

var $ = function (id) { return document.getElementById(id); };

/* ---------- PINパッド ---------- */
var pinBuf = '';
var pinBusy = false;

function updatePinDots() {
  var dots = $('pin-dots').children;
  for (var i = 0; i < 4; i++) dots[i].classList.toggle('on', i < pinBuf.length);
}

function pinKey(k) {
  if (pinBusy) return;
  if (k === 'c') { pinBuf = ''; }
  else if (k === 'b') { pinBuf = pinBuf.slice(0, -1); }
  else if (pinBuf.length < 4) { pinBuf += k; }
  $('pin-msg').textContent = '';
  updatePinDots();
  if (pinBuf.length === 4) {
    submitPin(pinBuf);
  }
}

$('pin-pad').addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-k]');
  if (btn) pinKey(btn.getAttribute('data-k'));
});

/* ---------- contacts 照合 ---------- */
function submitPin(pin) {
  pinBusy = true;
  fetch(ENDPOINT + '?action=contacts&pin=' + encodeURIComponent(pin), { method: 'GET' })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      pinBusy = false;
      pinBuf = '';
      updatePinDots();
      if (data && data.ok) {
        showContacts(data.contacts);
      } else {
        $('pin-msg').textContent = 'あんしょうばんごうが ちがうみたい';
      }
    })
    .catch(function () {
      pinBusy = false;
      pinBuf = '';
      updatePinDots();
      showView('call');
      $('error-card').classList.remove('hidden');
    });
}

function showContacts(contacts) {
  showView('call');
  $('error-card').classList.add('hidden');
  var box = $('call-btns');
  box.innerHTML = '';
  var list = Array.isArray(contacts) ? contacts : [];
  if (list.length === 0) {
    $('notset-msg').classList.remove('hidden');
    return;
  }
  $('notset-msg').classList.add('hidden');
  list.forEach(function (c) {
    var a = document.createElement('a');
    a.className = 'call-btn ' + (c.label === 'ママ' ? 'cb-mama' : 'cb-papa');
    a.href = c.url;
    a.textContent = '📞 ' + c.label + 'に でんわ';
    box.appendChild(a);
  });
}

/* ---------- 画面切替 ---------- */
function showView(name) {
  $('view-pin').classList.toggle('hidden', name !== 'pin');
  $('view-call').classList.toggle('hidden', name !== 'call');
}

$('retry-btn').addEventListener('click', function () {
  showView('pin');
  $('pin-msg').textContent = '';
});

updatePinDots();
</script>
