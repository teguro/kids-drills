<script>
/* ===== ドリルランド PINゲート（そとがわチェック） =====
   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=news.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す ===== */
(function () {
  var SITE_VERSION = "20261128-15";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラジオ | ただいま</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff8e7; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 44px; }
  h1 { font-size: 29px; text-align: center; margin: 6px 0 4px; }
  .sub { text-align: center; color: #777; font-size: 15px; margin-bottom: 16px; line-height: 1.6; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 20px; margin: 0 0 12px; }
  .ep-title { font-size: 19px; font-weight: bold; line-height: 1.5; }
  .ep-onair { font-size: 14px; color: #888; margin-top: 2px; }
  audio { width: 100%; margin-top: 14px; height: 48px; }
  .play-note { font-size: 14px; color: #888; text-align: center; margin-top: 8px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-btn { font-family: inherit; font-size: 16.5px; font-weight: bold; color: #333; background: #fdf6e3; border: 2px solid #e8dcc0; border-radius: 14px; padding: 13px 10px; cursor: pointer; touch-action: manipulation; line-height: 1.35; }
  .menu-btn.on { background: #2e7de4; border-color: #2e7de4; color: #fff; }
  .prog-note { font-size: 15px; color: #777; margin: 0 0 4px; line-height: 1.6; }
  .ep-btn { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 17px; font-weight: bold; color: #333; background: #fdf6e3; border: 2px solid #e8dcc0; border-radius: 14px; padding: 13px 14px; margin-top: 10px; cursor: pointer; touch-action: manipulation; }
  .ep-btn.on { background: #e4572e; border-color: #e4572e; color: #fff; }
  .ep-btn .new { display: inline-block; background: #e4572e; color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }
  .ep-btn.on .new { background: #fff; color: #e4572e; }
  .ep-btn .sub-line { display: block; font-size: 13px; color: #999; font-weight: normal; margin-top: 2px; }
  .ep-btn.on .sub-line { color: #ffd9cc; }
  .summary-text { font-size: 16.5px; line-height: 1.85; white-space: pre-line; }
  .summary-date { font-size: 13.5px; color: #888; margin-top: 8px; }
  .fallback-btn { display: block; text-align: center; padding: 15px; border-radius: 14px; background: #2e7de4; color: #fff; font-size: 18px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .msg { min-height: 24px; text-align: center; font-size: 16px; font-weight: bold; margin-top: 12px; }
  .msg.err { color: #d33; }
  a.back { display: block; margin: 30px auto 0; max-width: 320px; text-align: center; padding: 16px; border-radius: 16px; background: #555; color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }
</style>

  html[data-theme="yuyake"] body{background:linear-gradient(180deg,#ff9d76 0%,#ffc98a 45%,#ffe9c9 100%);background-attachment:fixed;}
  html[data-theme="mori"] body{background:linear-gradient(180deg,#8fd694 0%,#cdf0c0 55%,#f4fae4 100%);background-attachment:fixed;}

<body>
<div class="wrap">
  <h1>📻 ラジオ</h1>
  <p class="sub">NHKの ラジオを きく ページ。<br>すきな 番組を えらんでね。</p>

  <!-- ============ 本体 ============ -->
  <section id="view-main">
    <div class="card">
      <h2>▶️ きく</h2>
      <div class="ep-title" id="ep-title">よみこみ中…</div>
      <div class="ep-onair" id="ep-onair"></div>
      <audio id="player" controls preload="none" playsinline></audio>
      <p class="play-note">▶ ボタンを おすと はじまるよ</p>
      <p class="msg err" id="play-msg"></p>
    </div>

    <div class="card">
      <h2>📋 番組メニュー</h2>
      <div class="menu-grid" id="program-menu"></div>
    </div>

    <div class="card">
      <h2 id="prog-name">やさしいことばニュース</h2>
      <p class="prog-note" id="prog-note"></p>
      <div id="prog-list"></div>
      <a class="fallback-btn hidden" id="prog-fallback" href="#" target="_blank" rel="noopener">らじる★らじるの ページで きく</a>
    </div>

    <div class="card hidden" id="summary-card">
      <h2>📰 きょうのニュース（まとめ）</h2>
      <div class="summary-text" id="summary-text"></div>
      <div class="summary-date" id="summary-date"></div>
    </div>
  </section>

</div>

<script>
'use strict';
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyurtmUMcRCv2MmyBu96IlMEbBIpReYApm1QwtaI52hEh1JWn_fK4BrMhHgDkhszmZIBg/exec';

/* 番組メニュー：key はサーバー（action=yasashii）の返却キーと一致させる */
var PROGRAMS = [
  { key: 'episodes',  name: '📰 やさしいことばニュース', short: 'やさしいことばニュース', note: '月よう日〜金よう日の ニュースを、やさしい ことばで つたえるよ。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=34PY344RPJ_01', label: 'date' },
  { key: 'taiso',     name: '🤸 ラジオ体操', short: 'ラジオ体操', note: 'あさの 体操。さいしんの 回が 1つだけ あるよ（歌 → 第1 → 第2、10分くらい）。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=N9N4P87RLP_01', label: 'date' },
  { key: 'kodomo',    name: '📞 子ども科学電話相談', short: '子ども科学電話相談', note: 'まいしゅう 日よう日 あさ10時から。子どもたちの しつもんに 先生が 答えるよ。きけるのは 1週間だけ！', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=P3X5LNZ17X_00', label: 'kodomo' },
  { key: 'minna',     name: '🎵 みんなのうた', short: 'みんなのうた', note: 'NHKの うたの 番組。あたらしい うたが きけるよ。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=GPVXV8GJ9V_01', label: 'title' },
  { key: 'yamacafe',  name: '⛰️ 石丸謙二郎の山カフェ', short: '石丸謙二郎の山カフェ', note: '石丸謙二郎さんの 山の おはなし。土よう日 あさ8時から。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=R84PG2X5PW_01', label: 'title' },
  { key: 'shinuchi',  name: '🎤 真打ち競演', short: '真打ち競演', note: '落語の 番組。土よう日 ひるすぎから。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=LXL3PYLGP9_01', label: 'title' },
  { key: 'chikyu',    name: '🌏 ちきゅうラジオ', short: 'ちきゅうラジオ', note: '世界の ことを 知る 番組。土よう日・日よう日の ゆうがた。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=LR62K9QV6M_05', label: 'title' },
  { key: 'kuradashi', name: '📚 蔵出し名人会', short: '蔵出し名人会', note: 'むかしの 名人の 落語が きけるよ。月に 数回、土よう日の 夜。', fallback: 'https://www.nhk.or.jp/radio/ondemand/detail.html?p=VWW7NP6Y6J_01', label: 'title' }
];

var DATA = {};
var SUMMARY = null;
var currentKey = 'episodes';

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function progOf(key) {
  for (var i = 0; i < PROGRAMS.length; i++) if (PROGRAMS[i].key === key) return PROGRAMS[i];
  return PROGRAMS[0];
}

/* ---------- 放送データ読み込み ---------- */
var BOARD_PIN = '2002';

function apiUrl(params) {
  var q = [];
  for (var k in params) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  return ENDPOINT + '?' + q.join('&');
}

function loadYasashii() {
  fetch(apiUrl({ action: 'yasashii', pin: BOARD_PIN }))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) throw new Error('bad response');
      DATA = j;
      SUMMARY = j.summary || null;
      renderMenu();
      selectProgram('episodes', true);
    })
    .catch(function () {
      $('ep-title').textContent = 'よみこめなかった…';
      $('play-msg').textContent = 'ネットが つながらないかも。あとで また ためしてね';
      renderMenu();
    });
}
loadYasashii();

/* ---------- 番組メニュー ---------- */
function renderMenu() {
  var menu = $('program-menu');
  menu.innerHTML = '';
  PROGRAMS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'menu-btn' + (p.key === currentKey ? ' on' : '');
    b.textContent = p.name;
    b.addEventListener('click', function () { selectProgram(p.key, false); });
    menu.appendChild(b);
  });
}

function selectProgram(key, first) {
  currentKey = key;
  renderMenu();
  var p = progOf(key);
  $('prog-name').textContent = p.name;
  $('prog-note').textContent = p.note;
  var fb = $('prog-fallback');
  fb.href = p.fallback;
  fb.classList.remove('hidden');
  renderList(p);
  if (key === 'episodes') renderSummary();
  else $('summary-card').classList.add('hidden');
  if (first) {
    var list = (DATA[key] || []);
    if (list.length) playEpisode(list[0], $('prog-list').children[0], false);
  }
}

function renderList(p) {
  var list = $('prog-list');
  list.innerHTML = '';
  var eps = DATA[p.key] || [];
  if (!eps.length) {
    list.innerHTML = '<p style="font-size:15px;color:#999;">いまは きける 回が ないみたい。あとで また 見てね</p>';
    if (p.key === 'episodes') {
      $('ep-title').textContent = 'いまは きける ニュースが ないみたい';
      $('ep-onair').textContent = '月よう日〜金よう日の よるに あたらしくなるよ';
    }
    return;
  }
  eps.forEach(function (ep, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn';
    if (p.label === 'date') {
      var badge = '';
      if (p.key === 'taiso' && (ep.onair || '').indexOf('午前6:30') >= 0) badge = '<span class="new">あさ</span>';
      if (p.key === 'episodes' && i === 0) badge = '<span class="new">さいしん</span>';
      b.innerHTML = esc(ep.onair || ep.title) + badge;
    } else if (p.label === 'kodomo') {
      var theme = (ep.title || '').replace(/^子ども科学電話相談\s*/, '');
      b.innerHTML = esc(theme || ep.title) +
        '<span class="sub-line">' + esc(ep.onair || '') + '</span>';
    } else {
      b.innerHTML = esc(ep.title || '') +
        '<span class="sub-line">' + esc(ep.onair || '') + '</span>' +
        (i === 0 ? '<span class="new">さいしん</span>' : '');
    }
    b.addEventListener('click', function () { playEpisode(ep, b, true); });
    list.appendChild(b);
  });
}

/* ---------- プレーヤー（全番組で共有） ---------- */
function playEpisode(ep, btn, play) {
  if (!ep) return;
  var btns = $('prog-list').children;
  for (var k = 0; k < btns.length; k++) {
    btns[k].className = btns[k].className.replace(' on', '');
  }
  if (btn) btn.className += ' on';
  $('ep-title').textContent = ep.title || progOf(currentKey).short;
  $('ep-onair').textContent = ep.onair || '';
  $('play-msg').textContent = '';
  var player = $('player');
  player.src = ep.stream;
  if (play) {
    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var pr = player.play();
    if (pr && pr.catch) pr.catch(function () {});
  }
}

$('player').addEventListener('error', function () {
  $('play-msg').textContent = 'うまく 再生できなかった…番組の 下にある「らじる★らじるの ページで きく」から きいてみてね';
}, true);

/* ---------- 要約（やさしいことばニュースのときだけ） ---------- */
function renderSummary() {
  if (!SUMMARY || !SUMMARY.text) { $('summary-card').classList.add('hidden'); return; }
  $('summary-text').textContent = SUMMARY.text;
  $('summary-date').textContent = SUMMARY.date ? SUMMARY.date + ' のニュース' : '';
  $('summary-card').classList.remove('hidden');
}
</script>
<a id="float-back" href="index.html" style="position:fixed;right:14px;bottom:14px;z-index:500;background:#ffffff;border:2px solid #8a8a8a;color:#333333;padding:10px 18px;border-radius:999px;font-size:16px;font-weight:bold;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.25);opacity:0.96;">← もどる</a>
