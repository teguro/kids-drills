   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=news.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す ===== */
(function () {
  var SITE_VERSION = "20261128-3";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff8e7; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 44px; }
  h1 { font-size: 29px; text-align: center; margin: 6px 0 4px; }
  .sub { text-align: center; color: #777; font-size: 15px; margin-bottom: 16px; line-height: 1.6; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 20px; margin: 0 0 12px; }
  .ep-title { font-size: 19px; font-weight: bold; line-height: 1.5; }
  .ep-onair { font-size: 14px; color: #888; margin-top: 2px; }
  audio { width: 100%; margin-top: 14px; height: 48px; }
  .play-note { font-size: 14px; color: #888; text-align: center; margin-top: 8px; }
  .ep-btn { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 17px; font-weight: bold; color: #333; background: #fdf6e3; border: 2px solid #e8dcc0; border-radius: 14px; padding: 13px 14px; margin-top: 10px; cursor: pointer; touch-action: manipulation; }
  .ep-btn.on { background: #e4572e; border-color: #e4572e; color: #fff; }
  .ep-btn .new { display: inline-block; background: #e4572e; color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }
  .ep-btn.on .new { background: #fff; color: #e4572e; }
  .summary-text { font-size: 16.5px; line-height: 1.85; white-space: pre-line; }
  .summary-date { font-size: 13.5px; color: #888; margin-top: 8px; }
  .fallback-btn { display: block; text-align: center; padding: 15px; border-radius: 14px; background: #2e7de4; color: #fff; font-size: 18px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .msg { min-height: 24px; text-align: center; font-size: 16px; font-weight: bold; margin-top: 12px; }
  .msg.err { color: #d33; }
  /* ---- PIN ---- */
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 16px 0 8px; }
  .pin-dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #bbb; background: transparent; }
  .pin-dot.on { background: #e4572e; border-color: #e4572e; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 12px auto 0; }
  .pin-key { font-family: inherit; font-size: 28px; font-weight: bold; padding: 16px 0; border: none; border-radius: 16px; background: #fdf1dc; color: #333; box-shadow: 0 3px 0 rgba(0,0,0,.12); cursor: pointer; touch-action: manipulation; }
  .pin-key:active { transform: translateY(2px); box-shadow: none; background: #f7e3c2; }
  .pin-msg { min-height: 26px; font-size: 17px; font-weight: bold; color: #d33; margin: 10px 0 0; text-align: center; }
  a.back { display: block; margin: 30px auto 0; max-width: 320px; text-align: center; padding: 16px; border-radius: 16px; background: #555; color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }
</style>

<body>
<div class="wrap">
  <h1>📻 ラジオ</h1>
  <p class="sub">NHK「やさしいことばニュース」と「ラジオ体操」を きく ページ。<br>ニュースは 月よう日〜金よう日、よる7時30分からの 5分間だよ。</p>

  <!-- ============ PIN入力 ============ -->
  <section id="view-pin">
    <div class="card">
      <h2 style="text-align:center;">あんしょうばんごうを いれてね</h2>
      <div class="pin-dots" id="pin-dots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <p class="pin-msg" id="pin-msg"></p>
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" type="button" data-k="1">1</button>
        <button class="pin-key" type="button" data-k="2">2</button>
        <button class="pin-key" type="button" data-k="3">3</button>
        <button class="pin-key" type="button" data-k="4">4</button>
        <button class="pin-key" type="button" data-k="5">5</button>
        <button class="pin-key" type="button" data-k="6">6</button>
        <button class="pin-key" type="button" data-k="7">7</button>
        <button class="pin-key" type="button" data-k="8">8</button>
        <button class="pin-key" type="button" data-k="9">9</button>
        <button class="pin-key" type="button" data-k="c">けす</button>
        <button class="pin-key" type="button" data-k="0">0</button>
        <button class="pin-key" type="button" data-k="b">←</button>
      </div>
    </div>
  </section>

  <!-- ============ 本体 ============ -->
  <section id="view-main" class="hidden">
    <div class="card">
      <h2>▶️ きく</h2>
      <div class="ep-title" id="ep-title">よみこみ中…</div>
      <div class="ep-onair" id="ep-onair"></div>
      <audio id="player" controls preload="none" playsinline></audio>
      <p class="play-note">▶ ボタンを おすと はじまるよ（5分くらい）</p>
      <div id="ep-list"></div>
      <p class="msg err" id="play-msg"></p>
    </div>

    <div class="card">
      <h2>🤸 ラジオ体操</h2>
      <p style="font-size:15px;color:#777;margin:0 0 4px;line-height:1.6;">あさ 6時30分の 回が おすすめ（歌 → 第1 → 第2、10分くらい）。<br>おすと 上の プレーヤーで ながれるよ。</p>
      <div id="taiso-list"></div>
    </div>

    <div class="card hidden" id="summary-card">
      <h2>📰 きょうのニュース（まとめ）</h2>
      <div class="summary-text" id="summary-text"></div>
      <div class="summary-date" id="summary-date"></div>
    </div>

    <div class="card">
      <h2>うまく きけないときは</h2>
      <a class="fallback-btn" href="https://www.nhk.or.jp/radio/ondemand/detail.html?p=34PY344RPJ_01" target="_blank" rel="noopener">らじる★らじるの ページで きく</a>
      <a class="fallback-btn" style="margin-top:10px;background:#2e7d4f;" href="https://www.nhk.or.jp/radio/ondemand/detail.html?p=N9N4P87RLP_01" target="_blank" rel="noopener">ラジオ体操の ページで きく</a>
    </div>
  </section>

  <a class="back" href="index.html">トップにもどる</a>
</div>

<script>
'use strict';
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyurtmUMcRCv2MmyBu96IlMEbBIpReYApm1QwtaI52hEh1JWn_fK4BrMhHgDkhszmZIBg/exec';

var currentPin = '';
var episodes = [];
var taiso = [];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- PINパッド ---------- */
var pinBuf = '';
function renderPinDots() {
  var dots = $('pin-dots').children;
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = 'pin-dot' + (i < pinBuf.length ? ' on' : '');
  }
}
$('pin-pad').addEventListener('click', function (ev) {
  var btn = ev.target.closest('.pin-key');
  if (!btn) return;
  var k = btn.getAttribute('data-k');
  if (k === 'c') pinBuf = '';
  else if (k === 'b') pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 4) pinBuf += k;
  renderPinDots();
  if (pinBuf.length === 4) {
    tryPin(pinBuf);
  }
});

function apiUrl(params) {
  var q = [];
  for (var k in params) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  return ENDPOINT + '?' + q.join('&');
}

function tryPin(pin) {
  $('pin-msg').textContent = 'かくにん中…';
  fetch(apiUrl({ action: 'yasashii', pin: pin }))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok) {
        $('pin-msg').textContent = 'あんしょうばんごうが ちがうみたい';
        pinBuf = '';
        renderPinDots();
        return;
      }
      currentPin = pin;
      episodes = j.episodes || [];
      taiso = j.taiso || [];
      $('view-pin').classList.add('hidden');
      $('view-main').classList.remove('hidden');
      renderEpisodes();
      renderTaiso();
      renderSummary(j.summary);
    })
    .catch(function () {
      $('pin-msg').textContent = 'つうしんエラー。もう一度ためしてね';
      pinBuf = '';
      renderPinDots();
    });
}

/* ---------- プレーヤー（ニュースと体操で共有） ---------- */
function clearBtnStates() {
  ['ep-list', 'taiso-list'].forEach(function (id) {
    var btns = $(id).children;
    for (var k = 0; k < btns.length; k++) {
      btns[k].className = btns[k].className.replace(' on', '');
    }
  });
}

function playEpisode(ep, btn, play) {
  if (!ep) return;
  clearBtnStates();
  if (btn) btn.className += ' on';
  $('ep-title').textContent = ep.title || 'やさしいことばニュース';
  $('ep-onair').textContent = ep.onair || '';
  $('play-msg').textContent = '';
  var player = $('player');
  player.src = ep.stream;
  if (play) {
    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
  }
}

function renderEpisodes() {
  var list = $('ep-list');
  list.innerHTML = '';
  if (!episodes.length) {
    $('ep-title').textContent = 'いまは きける ニュースが ないみたい';
    $('ep-onair').textContent = '月よう日〜金よう日の よるに あたらしくなるよ';
    return;
  }
  episodes.forEach(function (ep, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn';
    b.innerHTML = esc(ep.onair || ep.title) + (i === 0 ? '<span class="new">さいしん</span>' : '');
    b.addEventListener('click', function () { playEpisode(ep, b, true); });
    list.appendChild(b);
  });
  playEpisode(episodes[0], list.children[0], false);
}

function renderTaiso() {
  var list = $('taiso-list');
  list.innerHTML = '';
  if (!taiso.length) {
    list.innerHTML = '<p style="font-size:15px;color:#999;">いまは 体操が よみこめなかった…</p>';
    return;
  }
  taiso.forEach(function (ep) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn';
    var morning = (ep.onair || '').indexOf('午前6:30') >= 0;
    b.innerHTML = esc(ep.onair || ep.title) + (morning ? '<span class="new">あさ</span>' : '');
    b.addEventListener('click', function () { playEpisode(ep, b, true); });
    list.appendChild(b);
  });
}

$('player').addEventListener('error', function () {
  if (episodes.length || taiso.length) {
    $('play-msg').textContent = 'うまく 再生できなかった…下の「らじる★らじるの ページで きく」から きいてみてね';
  }
}, true);

/* ---------- 要約 ---------- */
function renderSummary(summary) {
  if (!summary || !summary.text) return;
  $('summary-text').textContent = summary.text;
  $('summary-date').textContent = summary.date ? summary.date + ' のニュース' : '';
  $('summary-card').classList.remove('hidden');
}
</script>
