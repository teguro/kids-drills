<script>
/* ===== ドリルランド PINゲート（そとがわチェック） ===== */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=play.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261127-11";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fdf6ff; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 44px; }
  h1 { font-size: 28px; text-align: center; margin: 6px 0 8px; }
  .status { text-align: center; font-size: 19px; font-weight: bold; margin-bottom: 12px; }
  .big-btn { display: block; width: 100%; border: none; border-radius: 16px; background: #8e44ad; color: #fff; font-family: inherit; font-size: 21px; font-weight: bold; padding: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); margin-bottom: 14px; }
  .big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .hole { aspect-ratio: 1; border: none; border-radius: 50%; background: radial-gradient(circle at 50% 65%, #a1887f 0%, #8d6e63 55%, #795548 100%); font-size: 52px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; padding: 0; }
  .hole .bird { visibility: hidden; transform: translateY(8px); transition: transform .12s; }
  .hole.up .bird { visibility: visible; transform: translateY(-6px); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { aspect-ratio: .78; border: none; border-radius: 14px; background: #8e44ad; color: #fff; font-size: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .card.open { background: #fff; box-shadow: inset 0 0 0 3px #d9c7ec; }
  .card.done { background: #e2f5e8; box-shadow: inset 0 0 0 3px #2e9e5b; }
  /* しゃしんパズル */
  .pz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 420px; margin: 0 auto; }
  .pz-piece { aspect-ratio: 1; border: none; border-radius: 8px; cursor: pointer; padding: 0; background-repeat: no-repeat; touch-action: manipulation; }
  .pz-piece.sel { box-shadow: 0 0 0 4px #f39c12; }
  .pz-sample { display: block; width: 110px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin: 0 auto 10px; }
  /* えさキャッチ */
  .catch-area { position: relative; height: 380px; border-radius: 18px; background: linear-gradient(180deg, #bfe8ff 0%, #e8f9ff 70%, #d9f2c2 100%); overflow: hidden; touch-action: none; }
  .catch-bird { position: absolute; bottom: 8px; width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.25); transform: translateX(-50%); pointer-events: none; }
  .fall-item { position: absolute; font-size: 34px; transform: translateX(-50%); pointer-events: none; line-height: 1; }
  /* ことりポップ */
  .hole .photo { width: 80%; height: 80%; border-radius: 50%; object-fit: cover; visibility: hidden; transform: translateY(8px); transition: transform .12s; pointer-events: none; }
  .hole.up .photo { visibility: visible; transform: translateY(-4px); }
  a.back { display: block; margin: 26px auto 0; max-width: 320px; text-align: center; padding: 15px; border-radius: 16px; background: #555; color: #fff; font-size: 19px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }
</style>

<script>
  /* ===== 共通タイマー（あそびコーナー） ===== */
  function playEndsAt() {
    try {
      var t = JSON.parse(localStorage.getItem("kidsdrills_playtimer_v1") || "null");
      return (t && t.endsAt) ? t.endsAt : 0;
    } catch (e) { return 0; }
  }
  function fmtRemain(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + ((s % 60) < 10 ? "0" : "") + (s % 60);
  }
  function tickTimer() {
    var e = playEndsAt(), now = Date.now();
    var bar = document.getElementById("timer-bar");
    var ov = document.getElementById("time-overlay");
    if (e && e > now) {
      ov.style.display = "none";
      bar.style.display = "";
      document.getElementById("timer-bar-time").textContent = fmtRemain(e - now);
      document.body.style.paddingTop = "48px";
    } else {
      bar.style.display = "none";
      document.body.style.paddingTop = "";
      ov.style.display = "flex";
      document.getElementById("overlay-text").textContent = e ? "じかん おわり！" : "まず タイマーを セットしてね";
    }
  }
  tickTimer();
  setInterval(tickTimer, 500);

  var gameKey = "touch";
  try {
    var g = new URLSearchParams(location.search).get("g");
    if (g === "memory" || g === "puzzle" || g === "catch" || g === "pop") gameKey = g;
  } catch (e) {}

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ===== あそび記録（だれが・どのゲームを・どれくらい） ===== */
  var PLAYLOG_KEY = "kidsdrills_playlog_v1";
  function plLoad() { try { return JSON.parse(localStorage.getItem(PLAYLOG_KEY) || "{}"); } catch (e) { return {}; } }
  function plSave(d) { try { localStorage.setItem(PLAYLOG_KEY, JSON.stringify(d)); } catch (e) {} }
  function plToday() { var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function plEntry(game) {
    var player = "";
    try { player = localStorage.getItem("kidsdrills_last_player") || ""; } catch (e) {}
    if (!player) return null;
    var d = plLoad();
    if (!d[player]) d[player] = {};
    if (!d[player][game]) d[player][game] = { sec: 0, plays: 0, best: null, done: 0, last: "" };
    return { d: d, e: d[player][game] };
  }
  function plBest(game, score) {
    var r = plEntry(game); if (!r) return;
    if (r.e.best === null || score > r.e.best) r.e.best = score;
    r.e.last = plToday();
    plSave(r.d);
  }
  function plDone(game) {
    var r = plEntry(game); if (!r) return;
    r.e.done += 1;
    r.e.last = plToday();
    plSave(r.d);
  }
  var plGame = gameKey;
  var plStart = Date.now();
  var plCounted = false;
  function plTick() {
    var now = Date.now();
    var add = Math.round((now - plStart) / 1000);
    plStart = now;
    if (add <= 0) return;
    var r = plEntry(plGame); if (!r) return;
    r.e.sec += add;
    if (!plCounted) { r.e.plays += 1; plCounted = true; }
    r.e.last = plToday();
    plSave(r.d);
  }
  setInterval(plTick, 5000);
  window.addEventListener("pagehide", plTick);
  document.addEventListener("visibilitychange", function () { if (document.hidden) plTick(); });

  /* ===== ことりタッチ ===== */
  if (gameKey === "touch") {
    document.getElementById("touch-game").classList.remove("hidden");
    document.title = "ことりタッチ | あそびコーナー";
    var BIRDS = ["🐦", "🦆", "🦉", "🐧", "🦅", "🕊️", "🦢", "🐥"];
    var holesEl = document.getElementById("holes");
    var holeBtns = [];
    for (var i = 0; i < 9; i++) {
      (function () {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "hole";
        var s = document.createElement("span");
        s.className = "bird";
        s.textContent = "🐦";
        b.appendChild(s);
        b.addEventListener("click", function () {
          if (touch.up === b) {
            touch.score++;
            b.classList.remove("up");
            touch.up = null;
            paintTouchStatus();
          }
        });
        holesEl.appendChild(b);
        holeBtns.push(b);
      })();
    }
    var touch = { playing: false, score: 0, up: null, endAt: 0, popTimer: null, tickInt: null };
    function paintTouchStatus() {
      var left = Math.max(0, Math.ceil((touch.endAt - Date.now()) / 1000));
      document.getElementById("touch-status").textContent = touch.playing
        ? "のこり " + left + "びょう　⭐ " + touch.score + "羽"
        : "⭐ " + touch.score + "羽 タッチできた！";
    }
    function popBird() {
      if (!touch.playing) return;
      holeBtns.forEach(function (h) { h.classList.remove("up"); });
      var b = holeBtns[Math.floor(Math.random() * holeBtns.length)];
      b.querySelector(".bird").textContent = BIRDS[Math.floor(Math.random() * BIRDS.length)];
      b.classList.add("up");
      touch.up = b;
      touch.popTimer = setTimeout(popBird, 620 + Math.random() * 350);
    }
    document.getElementById("touch-start").addEventListener("click", function () {
      if (touch.popTimer) clearTimeout(touch.popTimer);
      if (touch.tickInt) clearInterval(touch.tickInt);
      touch.playing = true;
      touch.score = 0;
      touch.endAt = Date.now() + 30 * 1000;
      document.getElementById("touch-start").textContent = "もういちど";
      paintTouchStatus();
      popBird();
      touch.tickInt = setInterval(function () {
        if (Date.now() >= touch.endAt) {
          touch.playing = false;
          clearInterval(touch.tickInt);
          if (touch.popTimer) clearTimeout(touch.popTimer);
          holeBtns.forEach(function (h) { h.classList.remove("up"); });
          touch.up = null;
          document.getElementById("touch-status").textContent = "おわり！ ⭐ " + touch.score + "羽 タッチできた！";
          plBest("touch", touch.score);
        } else {
          paintTouchStatus();
        }
      }, 250);
    });
  }

  /* ===== しんけいすいじゃく ===== */
  if (gameKey === "memory") {
    document.getElementById("memory-game").classList.remove("hidden");
    document.title = "しんけいすいじゃく | あそびコーナー";
    var FACES = ["🐦", "🦉", "🦆", "🐧", "🦅", "🕊️"];
    var mem = { open: [], matched: 0, moves: 0, lock: false };
    function buildMemory() {
      mem = { open: [], matched: 0, moves: 0, lock: false };
      document.getElementById("memory-status").textContent = "カードを 2まい めくって ペアを あててね";
      var deck = shuffle(FACES.concat(FACES));
      var box = document.getElementById("cards");
      box.innerHTML = "";
      deck.forEach(function (face) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "card";
        b.textContent = "？";
        b.setAttribute("data-face", face);
        b.addEventListener("click", function () { flipCard(b); });
        box.appendChild(b);
      });
    }
    function flipCard(b) {
      if (mem.lock || b.classList.contains("open") || b.classList.contains("done")) return;
      b.classList.add("open");
      b.textContent = b.getAttribute("data-face");
      mem.open.push(b);
      if (mem.open.length < 2) return;
      mem.moves++;
      var x = mem.open[0], y = mem.open[1];
      if (x.getAttribute("data-face") === y.getAttribute("data-face")) {
        x.classList.add("done");
        y.classList.add("done");
        mem.open = [];
        mem.matched++;
        if (mem.matched >= FACES.length) {
          document.getElementById("memory-status").textContent = "🎉 できた！ " + mem.moves + "回で そろったよ！";
          plDone("memory");
        } else {
          document.getElementById("memory-status").textContent = "ペア " + mem.matched + " / " + FACES.length + "（" + mem.moves + "回 めくった）";
        }
      } else {
        mem.lock = true;
        document.getElementById("memory-status").textContent = "ペア " + mem.matched + " / " + FACES.length + "（" + mem.moves + "回 めくった）";
        setTimeout(function () {
          x.classList.remove("open");
          y.classList.remove("open");
          x.textContent = "？";
          y.textContent = "？";
          mem.open = [];
          mem.lock = false;
        }, 800);
      }
    }
    document.getElementById("memory-start").addEventListener("click", buildMemory);
    buildMemory();
  }

  /* ===== 鳥の写真データ（ガチャと共通の30種） ===== */
  var PHOTO_BIRDS = [
    { name: "スズメ", img: "sparrow.jpg", size: "約14cm" }, { name: "シジュウカラ", img: "shijukara.jpg", size: "約15cm" },
    { name: "モズ", img: "mozu.jpg", size: "約20cm" }, { name: "メジロ", img: "mejiro.jpg", size: "約12cm" },
    { name: "ヒヨドリ", img: "hiyodori.jpg", size: "約28cm" }, { name: "ツバメ", img: "tsubame.jpg", size: "約17cm" },
    { name: "エナガ", img: "enaga.jpg", size: "約14cm" }, { name: "ハクセキレイ", img: "hakusekirei.jpg", size: "約21cm" },
    { name: "コゲラ", img: "kogera.jpg", size: "約15cm" }, { name: "ウミネコ", img: "umineko.jpg", size: "約44cm" },
    { name: "コアジサシ", img: "koajisashi.jpg", size: "約24cm" }, { name: "ハマシギ", img: "hamashigi.jpg", size: "約21cm" },
    { name: "メダイチドリ", img: "medaichidori.jpg", size: "約19cm" }, { name: "ムナグロ", img: "munaguro.jpg", size: "約24cm" },
    { name: "ツミ", img: "tsumi.jpg", size: "約27cm" }, { name: "カワセミ", img: "kawasemi.jpg", size: "約17cm" },
    { name: "ノスリ", img: "nosuri.jpg", size: "約55cm" }, { name: "ハイタカ", img: "haitaka.jpg", size: "約35cm" },
    { name: "サシバ", img: "sashiba.jpg", size: "約50cm" }, { name: "チョウゲンボウ", img: "chougenbou.jpg", size: "約35cm" },
    { name: "フクロウ", img: "fukurou.jpg", size: "約50cm" }, { name: "アオバズク", img: "aobazuku.jpg", size: "約29cm" },
    { name: "オオタカ", img: "ootaka.jpg", size: "約55cm" }, { name: "ウミスズメ", img: "umisuzume.jpg", size: "約26cm" },
    { name: "クマタカ", img: "kumataka.jpg", size: "約75cm" }, { name: "ハヤブサ", img: "hayabusa.jpg", size: "約45cm" },
    { name: "イヌワシ", img: "inuwashi.jpg", size: "約85cm" }, { name: "チゴハヤブサ", img: "chigohayabusa.jpg", size: "約31cm" },
    { name: "トラフズク", img: "torafuzuku.jpg", size: "約38cm" }, { name: "オオワシ", img: "oowashi.jpg", size: "約95cm" }
  ];
  function photoBird(name) {
    for (var i = 0; i < PHOTO_BIRDS.length; i++) if (PHOTO_BIRDS[i].name === name) return PHOTO_BIRDS[i];
    return PHOTO_BIRDS[0];
  }

  /* ===== しゃしんパズル ===== */
  if (gameKey === "puzzle") {
    document.getElementById("puzzle-game").classList.remove("hidden");
    document.title = "しゃしんパズル | あそびコーナー";
    var pz = { bird: null, order: [], sel: -1, moves: 0, done: false };
    function pzSolved() {
      for (var i = 0; i < 9; i++) if (pz.order[i] !== i) return false;
      return true;
    }
    function paintPuzzle() {
      var box = document.getElementById("puzzle-grid");
      box.innerHTML = "";
      pz.order.forEach(function (piece, pos) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "pz-piece" + (pz.sel === pos ? " sel" : "");
        b.style.backgroundImage = "url('bird-assets/" + pz.bird.img + "')";
        b.style.backgroundSize = "300% 300%";
        b.style.backgroundPosition = ((piece % 3) * 50) + "% " + (Math.floor(piece / 3) * 50) + "%";
        b.addEventListener("click", function () { tapPiece(pos); });
        box.appendChild(b);
      });
    }
    function tapPiece(pos) {
      if (pz.done) return;
      if (pz.sel === -1) { pz.sel = pos; paintPuzzle(); return; }
      if (pz.sel === pos) { pz.sel = -1; paintPuzzle(); return; }
      var t = pz.order[pz.sel]; pz.order[pz.sel] = pz.order[pos]; pz.order[pos] = t;
      pz.sel = -1;
      pz.moves++;
      paintPuzzle();
      if (pzSolved()) {
        pz.done = true;
        document.getElementById("puzzle-status").textContent =
          "🎉 かんせい！ " + pz.bird.name + "（" + pz.bird.size + "） " + pz.moves + "回で できたよ！";
        plDone("puzzle");
      } else {
        document.getElementById("puzzle-status").textContent = pz.moves + "回 入れかえたよ。あと少し！";
      }
    }
    function buildPuzzle() {
      pz.bird = PHOTO_BIRDS[Math.floor(Math.random() * PHOTO_BIRDS.length)];
      document.getElementById("puzzle-sample").src = "bird-assets/" + pz.bird.img;
      pz.order = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]);
      if (pzSolved()) { var t = pz.order[0]; pz.order[0] = pz.order[1]; pz.order[1] = t; }
      pz.sel = -1; pz.moves = 0; pz.done = false;
      document.getElementById("puzzle-status").textContent = "タップで 2まい えらんで 入れかえてね";
      paintPuzzle();
    }
    document.getElementById("puzzle-start").addEventListener("click", buildPuzzle);
    buildPuzzle();
  }

  /* ===== えさキャッチ ===== */
  if (gameKey === "catch") {
    document.getElementById("catch-game").classList.remove("hidden");
    document.title = "えさキャッチ | あそびコーナー";
    var area = document.getElementById("catch-area");
    var birdEl = document.getElementById("catch-bird");
    var cg = { playing: false, score: 0, endAt: 0, birdX: 50, items: [], spawnTimer: null, animInt: null, tickInt: null };
    var FRUITS = ["🍒", "🌰", "🍎", "🫐"];
    function paintCatchStatus() {
      var left = Math.max(0, Math.ceil((cg.endAt - Date.now()) / 1000));
      document.getElementById("catch-status").textContent = cg.playing
        ? "のこり " + left + "びょう　⭐ " + cg.score + "こ"
        : "⭐ " + cg.score + "こ キャッチできた！";
    }
    function setBirdX(clientX) {
      var r = area.getBoundingClientRect();
      var p = (clientX - r.left) / r.width * 100;
      cg.birdX = Math.max(9, Math.min(91, p));
      birdEl.style.left = cg.birdX + "%";
    }
    area.addEventListener("pointerdown", function (e) { setBirdX(e.clientX); });
    area.addEventListener("pointermove", function (e) { if (e.buttons || e.pointerType === "touch") setBirdX(e.clientX); });
    function spawnItem() {
      if (!cg.playing) return;
      var rock = Math.random() < 0.2;
      var el = document.createElement("span");
      el.className = "fall-item";
      el.textContent = rock ? "🪨" : FRUITS[Math.floor(Math.random() * FRUITS.length)];
      var x = 6 + Math.random() * 88;
      el.style.left = x + "%";
      el.style.top = "-42px";
      area.appendChild(el);
      cg.items.push({ el: el, x: x, y: -42, rock: rock, speed: 2.4 + Math.random() * 1.8 });
      cg.spawnTimer = setTimeout(spawnItem, 480 + Math.random() * 420);
    }
    function stepItems() {
      var H = area.clientHeight || 380;
      var catchTop = H - 92;
      for (var i = cg.items.length - 1; i >= 0; i--) {
        var it = cg.items[i];
        it.y += it.speed;
        if (it.y >= catchTop && it.y <= H - 20) {
          if (Math.abs(it.x - cg.birdX) < 11) {
            if (it.rock) cg.score = Math.max(0, cg.score - 1);
            else cg.score++;
            paintCatchStatus();
            it.el.remove();
            cg.items.splice(i, 1);
            continue;
          }
        }
        if (it.y > H + 10) { it.el.remove(); cg.items.splice(i, 1); continue; }
        it.el.style.top = it.y + "px";
      }
    }
    document.getElementById("catch-start").addEventListener("click", function () {
      if (cg.spawnTimer) clearTimeout(cg.spawnTimer);
      if (cg.animInt) clearInterval(cg.animInt);
      if (cg.tickInt) clearInterval(cg.tickInt);
      cg.items.forEach(function (it) { it.el.remove(); });
      cg.items = [];
      cg.playing = true;
      cg.score = 0;
      cg.endAt = Date.now() + 30 * 1000;
      document.getElementById("catch-start").textContent = "もういちど";
      paintCatchStatus();
      spawnItem();
      cg.animInt = setInterval(stepItems, 30);
      cg.tickInt = setInterval(function () {
        if (Date.now() >= cg.endAt) {
          cg.playing = false;
          clearInterval(cg.tickInt);
          clearInterval(cg.animInt);
          if (cg.spawnTimer) clearTimeout(cg.spawnTimer);
          cg.items.forEach(function (it) { it.el.remove(); });
          cg.items = [];
          document.getElementById("catch-status").textContent = "おわり！ ⭐ " + cg.score + "こ キャッチできた！";
          plBest("catch", cg.score);
        } else {
          paintCatchStatus();
        }
      }, 250);
    });
  }

  /* ===== ことりポップ ===== */
  if (gameKey === "pop") {
    document.getElementById("pop-game").classList.remove("hidden");
    document.title = "ことりポップ | あそびコーナー";
    var POP_SMALL = ["スズメ", "シジュウカラ", "モズ", "メジロ", "ヒヨドリ", "ツバメ", "エナガ", "ハクセキレイ", "コゲラ", "ウミネコ", "コアジサシ", "ハマシギ", "メダイチドリ", "ムナグロ", "カワセミ", "ウミスズメ"].map(photoBird);
    var POP_RAPTOR = ["ツミ", "ハイタカ", "オオタカ", "ノスリ", "サシバ", "チョウゲンボウ", "フクロウ", "アオバズク", "クマタカ", "ハヤブサ", "イヌワシ", "チゴハヤブサ", "トラフズク", "オオワシ"].map(photoBird);
    var popHolesEl = document.getElementById("pop-holes");
    var popHoles = [];
    for (var pi = 0; pi < 9; pi++) {
      (function () {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "hole";
        var img = document.createElement("img");
        img.className = "photo";
        img.alt = "";
        b.appendChild(img);
        var h = { btn: b, img: img, bird: null, raptor: false, hideTimer: null };
        b.addEventListener("click", function () {
          if (!pop.playing || !h.bird) return;
          if (h.raptor) pop.score = Math.max(0, pop.score - 2);
          else pop.score++;
          clearPopHole(h);
          paintPopStatus();
        });
        popHolesEl.appendChild(b);
        popHoles.push(h);
      })();
    }
    var pop = { playing: false, score: 0, endAt: 0, spawnTimer: null, tickInt: null };
    function clearPopHole(h) {
      h.bird = null;
      h.btn.classList.remove("up");
      if (h.hideTimer) { clearTimeout(h.hideTimer); h.hideTimer = null; }
    }
    function paintPopStatus() {
      var left = Math.max(0, Math.ceil((pop.endAt - Date.now()) / 1000));
      document.getElementById("pop-status").textContent = pop.playing
        ? "のこり " + left + "びょう　⭐ " + pop.score + "羽"
        : "⭐ " + pop.score + "羽 タッチできた！";
    }
    function popSpawn() {
      if (!pop.playing) return;
      var free = popHoles.filter(function (h) { return !h.bird; });
      if (free.length) {
        var h = free[Math.floor(Math.random() * free.length)];
        var raptor = Math.random() < 0.3;
        var list = raptor ? POP_RAPTOR : POP_SMALL;
        h.bird = list[Math.floor(Math.random() * list.length)];
        h.raptor = raptor;
        h.img.src = "bird-assets/" + h.bird.img;
        h.btn.classList.add("up");
        h.hideTimer = setTimeout(function () { clearPopHole(h); }, 950);
      }
      var elapsed = 30 - Math.max(0, Math.ceil((pop.endAt - Date.now()) / 1000));
      pop.spawnTimer = setTimeout(popSpawn, Math.max(400, 760 - elapsed * 13));
    }
    document.getElementById("pop-start").addEventListener("click", function () {
      if (pop.spawnTimer) clearTimeout(pop.spawnTimer);
      if (pop.tickInt) clearInterval(pop.tickInt);
      popHoles.forEach(clearPopHole);
      pop.playing = true;
      pop.score = 0;
      pop.endAt = Date.now() + 30 * 1000;
      document.getElementById("pop-start").textContent = "もういちど";
      paintPopStatus();
      popSpawn();
      pop.tickInt = setInterval(function () {
        if (Date.now() >= pop.endAt) {
          pop.playing = false;
          clearInterval(pop.tickInt);
          if (pop.spawnTimer) clearTimeout(pop.spawnTimer);
          popHoles.forEach(clearPopHole);
          document.getElementById("pop-status").textContent = "おわり！ ⭐ " + pop.score + "羽 タッチできた！";
          plBest("pop", pop.score);
        } else {
          paintPopStatus();
        }
      }, 250);
    });
  }
</script>
