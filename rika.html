<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>りかドリル</title>
<style>
  :root{
    --bg:#FFF6D6; --bg2:#DFF3FF; --card:#FFFFFF; --ink:#2B2118; --muted:#6B5D4F;
    --orange:#FF8A2A; --orange-d:#E56E0B; --sky:#2FA8E0; --sky-d:#1B7FB8;
    --green:#2FBF71; --green-d:#1E9E57; --pink:#FF6B9D; --yellow:#FFC93C;
    --wrong:#E5484D; --line:#F0DFB8; --choice-bg:#FFF9EC; --choice-line:#EAD9AE;
    --shadow:0 6px 0 rgba(120,80,10,.14);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1E1A2E; --bg2:#16283A; --card:#2C2742; --ink:#FFF6E3; --muted:#CFC4B0;
      --line:#4A4266; --choice-bg:#383152; --choice-line:#554A7A;
      --shadow:0 6px 0 rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 260px,var(--bg) 100%);
    color:var(--ink); min-height:100dvh;
  }
  button{font-family:inherit; cursor:pointer;}
  button, [role="button"]{min-height:44px;}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px;}
  .hidden{display:none !important;}
  .hero{text-align:center;padding:14px 6px 4px;}
  .hero-icon{width:104px;height:104px;margin:0 auto 2px;}
  h1{font-size:34px;line-height:1.25;margin:6px 0 4px;font-weight:900;letter-spacing:.02em;}
  .hero p{margin:4px 0;font-size:16px;color:var(--muted);font-weight:700;}
  .howto{
    background:var(--card);border:2px solid var(--line);border-radius:18px;
    padding:12px 16px;margin:14px 0 18px;font-size:15px;line-height:1.7;font-weight:700;
    box-shadow:var(--shadow);
  }
  .howto b{color:var(--orange-d);}
  .lv-title{font-size:19px;font-weight:900;margin:6px 0 10px;text-align:center;}
  .lv-card{
    display:block;width:100%;text-align:left;border:none;border-radius:20px;
    padding:16px 18px 14px;margin:0 0 14px;color:#fff;box-shadow:var(--shadow);
  }
  .lv-card:active{transform:translateY(2px);}
  .lv1{background:linear-gradient(135deg,#FFB03A,#FF8A2A);}
  .lv2{background:linear-gradient(135deg,#3EC6F0,#2FA8E0);}
  .lv3{background:linear-gradient(135deg,#4ED598,#1E9E57);}
  .lv-name{font-size:24px;font-weight:900;line-height:1.2;}
  .lv-sub{font-size:14px;font-weight:700;opacity:.95;margin-top:3px;line-height:1.5;}
  .lv-best{
    display:inline-block;background:rgba(255,255,255,.92);color:#5A3A00;
    font-size:13px;font-weight:900;border-radius:999px;padding:4px 12px;margin-top:9px;
  }
  .lv-best.none{background:rgba(255,255,255,.28);color:#fff;}
  .lv-start{font-size:15px;font-weight:900;margin-top:8px;opacity:.95;}
  .topbar{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap;}
  .quit-btn{
    border:2px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;font-size:14px;font-weight:900;padding:8px 16px;min-height:44px;
  }
  .progress{flex:1;min-width:90px;height:18px;background:var(--card);border:2px solid var(--line);border-radius:999px;overflow:hidden;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px;transition:width .35s ease;width:0%;}
  .qcount{font-size:15px;font-weight:900;white-space:nowrap;}
  .score-chip{font-size:15px;font-weight:900;white-space:nowrap;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;}
  .q-card{
    background:var(--card);border:2px solid var(--line);border-radius:24px;
    padding:22px 18px 20px;box-shadow:var(--shadow);text-align:center;
  }
  .q-kind{
    display:inline-block;font-size:13px;font-weight:900;border-radius:999px;padding:5px 14px;margin-bottom:12px;color:#fff;background:var(--sky);
  }
  .q-kind.c1{background:var(--orange);} .q-kind.c2{background:var(--sky);} .q-kind.c3{background:var(--green-d);}
  .q-text{font-size:26px;font-weight:900;line-height:1.5;word-break:normal;text-align:left;}
  @media (max-width:380px){ .q-text{font-size:23px;} }
  .q-ask{font-size:15px;font-weight:700;color:var(--muted);margin-top:8px;text-align:left;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  @media (max-width:380px){ .choices{grid-template-columns:1fr;} }
  .choice{
    border:3px solid var(--choice-line);background:var(--choice-bg);color:var(--ink);
    border-radius:18px;font-size:19px;font-weight:900;padding:14px 8px;min-height:64px;
    line-height:1.3;
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{border-color:var(--green);background:#DFF7E8;color:#0E6B38;}
  .choice.wrong{border-color:var(--wrong);background:#FDE3E3;color:#8F1D21;}
  .choice.dim{opacity:.45;}
  @media (prefers-color-scheme: dark){
    .choice.correct{background:#17402A;color:#8CF0B4;}
    .choice.wrong{background:#4A1E20;color:#FFB3B6;}
  }
  .feedback{margin-top:16px;border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.65;font-weight:700;text-align:left;}
  .feedback.ok{background:#DFF7E8;color:#0E5A30;border:2px solid var(--green);}
  .feedback.ng{background:#FDECEC;color:#7C1A1E;border:2px solid var(--wrong);}
  @media (prefers-color-scheme: dark){
    .feedback.ok{background:#17402A;color:#C9F5DA;}
    .feedback.ng{background:#4A1E20;color:#FFD9DA;}
  }
  .feedback .fb-head{font-size:20px;font-weight:900;}
  .next-btn{
    display:block;width:100%;margin-top:14px;border:none;border-radius:18px;
    background:var(--orange);color:#fff;font-size:21px;font-weight:900;padding:16px;min-height:60px;
    box-shadow:0 5px 0 var(--orange-d);
  }
  .next-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-d);}
  .result-card{
    background:var(--card);border:2px solid var(--line);border-radius:24px;
    padding:24px 18px 20px;box-shadow:var(--shadow);text-align:center;
  }
  .rank-icon{width:110px;height:110px;margin:0 auto;}
  .rank-name{font-size:30px;font-weight:900;margin:6px 0 2px;}
  .rank-score{font-size:19px;font-weight:900;color:var(--orange-d);}
  .rank-meta{font-size:15px;font-weight:700;color:var(--muted);margin-top:6px;line-height:1.7;}
  .newbest{
    display:inline-block;background:var(--yellow);color:#5A3A00;font-weight:900;
    border-radius:999px;padding:5px 16px;font-size:14px;margin-top:8px;
  }
  .stars{font-size:26px;letter-spacing:4px;margin-top:6px;color:var(--yellow);-webkit-text-stroke:1px #D9A400;}
  .review-title{font-size:19px;font-weight:900;margin:24px 0 10px;}
  .review-item{
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:12px 14px;margin:0 0 10px;text-align:left;
  }
  .review-item .r-q{font-size:17px;font-weight:900;line-height:1.45;}
  .review-item .r-a{font-size:14px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:3px;}
  .mark-ok{color:var(--green-d);font-weight:900;}
  .mark-ng{color:var(--wrong);font-weight:900;}
  .btn-row{display:grid;gap:12px;margin-top:18px;}
  .again-btn{
    border:none;border-radius:18px;background:var(--sky);color:#fff;
    font-size:20px;font-weight:900;padding:16px;min-height:60px;box-shadow:0 5px 0 var(--sky-d);
  }
  .again-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sky-d);}
  .home-btn{
    border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);
    font-size:18px;font-weight:900;padding:14px;min-height:56px;
  }
  .foot-note{text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin-top:20px;line-height:1.7;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <section id="screen-start">
    <div class="hero">
      <svg class="hero-icon" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M52 14 h16 M60 14 v22" stroke="#1B7FB8" stroke-width="5" stroke-linecap="round"/>
        <path d="M48 36 h24 l14 38 a10 10 0 0 1 -10 14 H44 a10 10 0 0 1 -10 -14 Z" fill="#DFF3FF" stroke="#2FA8E0" stroke-width="4" stroke-linejoin="round"/>
        <path d="M40 66 h40 l4 10 a6 6 0 0 1 -6 8 H42 a6 6 0 0 1 -6 -8 Z" fill="#2FBF71"/>
        <circle cx="52" cy="56" r="3.5" fill="#2FA8E0"/><circle cx="66" cy="50" r="2.6" fill="#2FA8E0"/><circle cx="60" cy="60" r="2.2" fill="#2FA8E0"/>
        <circle cx="98" cy="26" r="10" fill="#FFC93C" stroke="#E56E0B" stroke-width="3"/>
        <path d="M98 10 v-4 M98 46 v-4 M82 26 h-4 M118 26 h-4" stroke="#E56E0B" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <h1>りかドリル</h1>
      <p>レベルを えらんで、<br>20もんに チャレンジ！ ふしぎを ときあかそう！</p>
    </div>

    <div class="howto">
      あそびかた： レベルを えらぶと、その レベルの もんだいが <b>ランダムに 20もん</b> でるよ。
      こたえは <b>4つの ボタン</b>から タップして えらんでね。
      1もんごとに せいかい・ふせいかいと かいせつが すぐ 出るよ。
      20もん ぜんぶ こたえると、スコアと しょうごうが もらえるよ！
    </div>

    <div class="lv-title">レベルを えらんでね</div>

    <button class="lv-card lv1" data-level="1">
      <div class="lv-name">レベル1　きせつ・天気・月と星</div>
      <div class="lv-sub">きせつと 生きもの（春・夏・秋・冬の しょくぶつや こん虫の へんか）／ 天気と 気温 ／ 月と 星の きそ</div>
      <span class="lv-best none" id="best-1">ベスト： まだ なし</span>
      <div class="lv-start">▶ タップして スタート（20もん）</div>
    </button>

    <button class="lv-card lv2" data-level="2">
      <div class="lv-name">レベル2　電気・温度・空気と水</div>
      <div class="lv-sub">電気の はたらき（かん電池・豆電球・直列と へい列）／ ものの 温度と 体積 ／ とじこめた 空気と 水</div>
      <span class="lv-best none" id="best-2">ベスト： まだ なし</span>
      <div class="lv-start">▶ タップして スタート（20もん）</div>
    </button>

    <button class="lv-card lv3" data-level="3">
      <div class="lv-name">レベル3　水・体・じっけん道具</div>
      <div class="lv-sub">水の すがた（じょう発・結ろ・ふっとう・こおる）／ 人の 体の つくりと 運動（骨と 筋肉）／ じっけん器具の 正しい 使い方</div>
      <span class="lv-best none" id="best-3">ベスト： まだ なし</span>
      <div class="lv-start">▶ タップして スタート（20もん）</div>
    </button>

    <p class="foot-note">ベストスコアは このページを ひらいている あいだだけ きろくされるよ。</p>
  </section>

  <section id="screen-game" class="hidden">
    <div class="topbar">
      <button class="quit-btn" id="quit-btn">← やめる</button>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="qcount" id="qcount">1 / 20</div>
      <div class="score-chip" id="score-chip">⭐ 0</div>
    </div>
    <div class="q-card">
      <span class="q-kind" id="q-kind">りか</span>
      <div class="q-text" id="q-text"></div>
      <div class="q-ask">こたえは どれかな？</div>
      <div class="choices" id="choices"></div>
      <div id="feedback-zone"></div>
    </div>
  </section>

  <section id="screen-result" class="hidden">
    <div class="result-card">
      <svg class="rank-icon" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="52" r="30" fill="#FFC93C" stroke="#E56E0B" stroke-width="4"/>
        <path d="M60 34 l5.5 11 12 1.7 -8.7 8.5 2 12 -10.8 -5.7 -10.8 5.7 2 -12 -8.7 -8.5 12 -1.7 Z" fill="#FFF6D6" stroke="#E56E0B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M44 78 L36 108 L60 94 L84 108 L76 78" fill="#2FA8E0" stroke="#1B7FB8" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <div class="rank-name" id="rank-name"></div>
      <div class="stars" id="rank-stars"></div>
      <div class="rank-score" id="rank-score"></div>
      <div class="rank-meta" id="rank-meta"></div>
      <div id="newbest-zone"></div>
    </div>
    <div class="review-title">ふりかえり（ぜんぶの もんだい）</div>
    <div id="review-list"></div>
    <div class="btn-row">
      <button class="again-btn" id="again-btn">もういちど おなじ レベル</button>
      <button class="home-btn" id="home-btn">レベルを えらびなおす</button>
    </div>
  </section>

</div>

<script>
"use strict";
/* 形式: q=もんだい, a=せいかい, w=まちがい3つ, h=かいせつ, c=カテゴリ */
var BANK = {
1: [
{q:"春に さく、ピンク色の 花と いえば 何かな？",a:"さくら",w:["ひまわり","コスモス","スイセン"],h:"さくらは 春を つげる 花だよ。",c:"きせつと 生きもの"},
{q:"春に 南の 国から 日本へ やってくる 鳥は 何かな？",a:"ツバメ",w:["スズメ","カラス","ハト"],h:"ツバメは 春に 日本へ 来て、秋に 南へ もどるよ。",c:"きせつと 生きもの"},
{q:"チョウは、たまご→よう虫→（　）→成虫の じゅんに 育つよ。（　）は 何かな？",a:"さなぎ",w:["いもむし","まゆ玉","ようせい"],h:"チョウは さなぎの 中で 体が 大きく 変わるよ。",c:"きせつと 生きもの"},
{q:"夏に「ミーンミーン」と 鳴く こん虫は 何かな？",a:"セミ",w:["コオロギ","バッタ","トンボ"],h:"セミは 夏に 木に とまって 大きな 声で 鳴くよ。",c:"きせつと 生きもの"},
{q:"夏に 大きな 黄色い 花を さかせ、背が 高く なる しょくぶつは 何かな？",a:"ヒマワリ",w:["チューリップ","タンポポ","パンジー"],h:"ヒマワリは 夏の 太陽の 下で ぐんぐん 大きく なるよ。",c:"きせつと 生きもの"},
{q:"秋に 葉が 赤く 色づく 木は 何かな？",a:"モミジ（カエデ）",w:["マツ","スギ","サクラ"],h:"モミジは 秋に 葉が 赤や 黄色に 変わるよ。これを 紅葉（こうよう）というよ。",c:"きせつと 生きもの"},
{q:"秋に 実が なる、オレンジ色の くだものは 何かな？",a:"カキ",w:["イチゴ","スイカ","ミカンの花"],h:"カキは 秋に オレンジ色の 実が なるよ。",c:"きせつと 生きもの"},
{q:"冬に 葉を 全部 落として 休む 木の ことを 何というかな？",a:"落葉樹（らくようじゅ）",w:["常緑樹（じょうりょくじゅ）","針葉樹だけ","花の木"],h:"サクラなどの 落葉樹は、冬に 葉を 落として 春を 待つよ。",c:"きせつと 生きもの"},
{q:"カエルは 冬の 間、どこで すごすことが 多いかな？",a:"土の 中で ねむる（冬眠）",w:["木の 上で 鳴く","南の 国へ 飛ぶ","水の 上を 泳ぐ"],h:"カエルは 冬、土の 中などで じっと ねむって すごすよ。これを 冬眠というよ。",c:"きせつと 生きもの"},
{q:"夏の 夜や 夕方に、クヌギなどの 木に 集まる 大きな こん虫は 何かな？",a:"カブトムシ",w:["テントウムシ","アリ","ハチドリ"],h:"カブトムシは 夏に 活動し、木の しるを すうよ。",c:"きせつと 生きもの"},
{q:"しょくぶつが よく 育つために 必要な ものは、どれかな？",a:"日光と 水",w:["暗い 場所と 風","音と 音楽","雪と 氷"],h:"しょくぶつは 日光と 水が あると よく 育つよ。",c:"きせつと 生きもの"},
{q:"夏に つるを のばし、朝に 大きな 花を さかせる しょくぶつは 何かな？",a:"アサガオ",w:["サクラ","ウメ","モミジ"],h:"アサガオは 夏の 朝に 花を 開くよ。",c:"きせつと 生きもの"},
{q:"秋の 野原に ピンクや 白の 花を たくさん さかせる 花は 何かな？",a:"コスモス",w:["ヒマワリ","チューリップ","スイセン"],h:"コスモスは 秋を 代表する 花だよ。",c:"きせつと 生きもの"},
{q:"タンポポの わた毛は、何に よって 遠くへ 運ばれるかな？",a:"風",w:["雨","川の 水","アリ"],h:"タンポポの たねは わた毛で 風に 乗って 遠くへ 運ばれるよ。",c:"きせつと 生きもの"},
{q:"春に なると、冬と くらべて 気温は どうなるかな？",a:"だんだん 高く なる",w:["だんだん 低く なる","ずっと 同じ","急に 0度に なる"],h:"春は 日に日に 暖かく なっていくよ。",c:"きせつと 生きもの"},
{q:"1年の 中で、昼の 長さが いちばん 長いのは いつごろかな？",a:"夏",w:["冬","春の はじめ","秋の おわり"],h:"夏は 太陽が 出ている 時間が 長く、昼が いちばん 長いよ。",c:"きせつと 生きもの"},
{q:"1年の 中で、昼の 長さが いちばん 短いのは いつごろかな？",a:"冬",w:["夏","春","秋"],h:"冬は 太陽が 出ている 時間が 短く、早く 暗く なるよ。",c:"きせつと 生きもの"},
{q:"春に たねを まいた ヘチマは、夏に どうなるかな？",a:"つるが のびて 大きな 葉と 花が ふえる",w:["葉が 全部 落ちる","実だけに なる","土の 中にもぐる"],h:"ヘチマは 夏に つるや 葉が ぐんぐん のびて、花が さくよ。",c:"きせつと 生きもの"},
{q:"秋に なると、多くの こん虫の すがたは どうなるかな？",a:"数が へって、見かけることが 少なくなる",w:["夏より ずっと ふえる","全部 鳥に なる","色が 青く なる"],h:"秋が 深まると こん虫の 活動は おとろえ、数が へるよ。",c:"きせつと 生きもの"},
{q:"モンシロチョウが 春に よく 見られるのは、なぜかな？",a:"暖かく なって 活動を はじめるから",w:["冬眠から さめた クマが 連れてくるから","雨が 多いから","月が 明るいから"],h:"こん虫は 暖かく なると 活動が 活発に なるよ。",c:"きせつと 生きもの"},
{q:"晴れの 日の 空の ようすは、どれかな？",a:"雲が 少ない、または ない",w:["雲が 空全体を おおう","雨が ふっている","雪が ふっている"],h:"雲の 量が 少ない 日を「晴れ」というよ。",c:"天気と 気温"},

var LEVEL_NAMES = {1:"レベル1",2:"レベル2",3:"レベル3"};
var KIND_CLASS = {"きせつと 生きもの":"c1","天気と 気温":"c1","月と 星":"c1","電気の はたらき":"c2","ものの 温度と 体積":"c2","とじこめた 空気と 水":"c2","水の すがた":"c3","人の 体の つくりと 運動":"c3","実験器具の 使い方":"c3"};

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

var best = {1:null,2:null,3:null};
var state = {level:1, questions:[], idx:0, score:0, answered:false, history:[]};

var elStart=document.getElementById("screen-start");
var elGame=document.getElementById("screen-game");
var elResult=document.getElementById("screen-result");

function show(screen){
  elStart.classList.toggle("hidden", screen!=="start");
  elGame.classList.toggle("hidden", screen!=="game");
  elResult.classList.toggle("hidden", screen!=="result");
}
function updateBestLabels(){
  for(var lv=1;lv<=3;lv++){
    var el=document.getElementById("best-"+lv);
    if(best[lv]===null){ el.textContent="ベスト： まだ なし"; el.classList.add("none"); }
    else { el.textContent="ベスト： "+best[lv]+" / 20"; el.classList.remove("none"); }
  }
}
function startGame(level){
  state.level=level;
  state.questions=shuffle(BANK[level]).slice(0,20);
  state.idx=0; state.score=0; state.history=[]; state.answered=false;
  show("game");
  renderQuestion();
}
function renderQuestion(){
  var q=state.questions[state.idx];
  state.answered=false;
  document.getElementById("qcount").textContent=(state.idx+1)+" / 20";
  document.getElementById("score-chip").textContent="⭐ "+state.score;
  document.getElementById("progress-bar").style.width=(state.idx/20*100)+"%";
  var kind=document.getElementById("q-kind");
  kind.textContent=q.c;
  kind.className="q-kind "+(KIND_CLASS[q.c]||"");
  document.getElementById("q-text").textContent=q.q;
  document.getElementById("feedback-zone").innerHTML="";
  var choices=shuffle([q.a].concat(q.w));
  var zone=document.getElementById("choices");
  zone.innerHTML="";
  choices.forEach(function(choice){
    var btn=document.createElement("button");
    btn.className="choice"; btn.textContent=choice;
    btn.addEventListener("click", function(){ answer(choice, btn); });
    zone.appendChild(btn);
  });
}
function answer(choice, btn){
  if(state.answered) return;
  state.answered=true;
  var q=state.questions[state.idx];
  var correct = (choice===q.a);
  if(correct) state.score++;
  var buttons=document.querySelectorAll(".choice");
  buttons.forEach(function(b){
    if(b.textContent===q.a) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
    b.disabled=true;
  });
  document.getElementById("score-chip").textContent="⭐ "+state.score;
  document.getElementById("progress-bar").style.width=((state.idx+1)/20*100)+"%";
  state.history.push({q:q, chosen:choice, correct:correct});
  var isLast = state.idx===19;
  var fb=document.createElement("div");
  fb.className="feedback "+(correct?"ok":"ng");
  fb.innerHTML = '<div class="fb-head">'+(correct?"⭕ せいかい！":"❌ ざんねん…")+'</div>'
    + (correct?"":"<div>せいかいは「<b>"+escapeHtml(q.a)+"</b>」だよ。</div>")
    + "<div>"+escapeHtml(q.h)+"</div>";
  var next=document.createElement("button");
  next.className="next-btn";
  next.textContent = isLast ? "けっかを 見る →" : "つぎの もんだいへ →";
  next.addEventListener("click", function(){
    if(isLast) showResult(); else { state.idx++; renderQuestion(); }
  });
  var zone=document.getElementById("feedback-zone");
  zone.innerHTML=""; zone.appendChild(fb); zone.appendChild(next);
  next.focus();
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function rankFor(score){
  if(score===20) return {name:"りかマスター", stars:"★★★", meta:"かんぺき！ ふしぎを ぜんぶ ときあかしたね。"};
  if(score>=18) return {name:"りかはかせ", stars:"★★★", meta:"すごい！ あと少しで かんぺきだよ。"};
  if(score>=15) return {name:"じっけん名人", stars:"★★☆", meta:"よく できました！ 観察の 力が ついているね。"};
  if(score>=10) return {name:"ふしぎハンター", stars:"★★☆", meta:"半分以上 せいかい！ まちがえた もんだいを ふりかえろう。"};
  if(score>=5) return {name:"たんけん隊いん", stars:"★☆☆", meta:"一歩ずつ 進んでいるよ。かいせつを 読んで もう一度 チャレンジ！"};
  return {name:"りか見習い", stars:"★☆☆", meta:"スタートラインに 立ったね。ふりかえりで かいせつを チェックしよう。"};
}
function showResult(){
  var rank=rankFor(state.score);
  document.getElementById("rank-name").textContent=rank.name;
  document.getElementById("rank-stars").textContent=rank.stars;
  document.getElementById("rank-score").textContent="20もん中 "+state.score+"もん せいかい！";
  document.getElementById("rank-meta").textContent=LEVEL_NAMES[state.level]+" ／ "+rank.meta;
  var isNewBest = (best[state.level]===null || state.score>best[state.level]);
  if(isNewBest) best[state.level]=state.score;
  document.getElementById("newbest-zone").innerHTML = isNewBest ? '<span class="newbest">🎉 ベストスコア こうしん！</span>' : "";
  var list=document.getElementById("review-list");
  list.innerHTML="";
  state.history.forEach(function(item, i){
    var div=document.createElement("div");
    div.className="review-item";
    div.innerHTML='<div class="r-q">'+(item.correct?'<span class="mark-ok">⭕</span>':'<span class="mark-ng">❌</span>')+" "+(i+1)+". "+escapeHtml(item.q.q)+'</div>'
      +'<div class="r-a">せいかい： '+escapeHtml(item.q.a)+(item.correct?"":" ／ きみの こたえ： "+escapeHtml(item.chosen))+"<br>"+escapeHtml(item.q.h)+'</div>';
    list.appendChild(div);
  });
  updateBestLabels();
  show("result");
  window.scrollTo(0,0);
}

document.querySelectorAll(".lv-card").forEach(function(card){
  card.addEventListener("click", function(){ startGame(parseInt(card.getAttribute("data-level"),10)); });
});
document.getElementById("quit-btn").addEventListener("click", function(){ show("start"); window.scrollTo(0,0); });
document.getElementById("again-btn").addEventListener("click", function(){ startGame(state.level); window.scrollTo(0,0); });
document.getElementById("home-btn").addEventListener("click", function(){ show("start"); window.scrollTo(0,0); });
updateBestLabels();
</script>
</body>
</html>
