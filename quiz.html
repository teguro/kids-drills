<script>
/* ===== ドリルランド PINゲート（そとがわチェック） ===== */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=play.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261128-9";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クイズ | あそびコーナー</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fdf6ff; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 44px; }
  h1 { font-size: 28px; text-align: center; margin: 6px 0 16px; }
  .lv-btn { display: block; width: 100%; border: 3px solid #d9c7ec; background: #fff; border-radius: 16px; font-family: inherit; font-size: 20px; font-weight: bold; padding: 16px; margin-bottom: 10px; cursor: pointer; text-align: center; }
  .lv-btn .lv-count { font-size: 13px; color: #999; font-weight: normal; }
  .progress { text-align: center; color: #888; font-size: 15px; margin-bottom: 8px; }
  .q-text { font-size: 21px; font-weight: bold; background: #fff; border-radius: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 18px 16px; margin-bottom: 12px; line-height: 1.5; }
  .q-img { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .choice { display: block; width: 100%; border: 3px solid #ddd; background: #fff; border-radius: 14px; font-family: inherit; font-size: 19px; font-weight: bold; padding: 14px; margin-bottom: 9px; cursor: pointer; text-align: left; touch-action: manipulation; }
  .choice.right { border-color: #2e9e5b; background: #e2f5e8; }
  .choice.wrong { border-color: #e05252; background: #fdeaea; }
  .choice:disabled { opacity: .95; }
  .feedback { background: #fffbe8; border: 2px solid #f0df9a; border-radius: 14px; padding: 14px; font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .feedback .mark { font-size: 24px; font-weight: bold; }
  .next-btn { display: block; width: 100%; border: none; border-radius: 16px; background: #8e44ad; color: #fff; font-family: inherit; font-size: 21px; font-weight: bold; padding: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .result-box { text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 28px 16px; }
  .result-score { font-size: 46px; font-weight: bold; color: #8e44ad; }
  .result-msg { font-size: 19px; font-weight: bold; margin: 8px 0 18px; }
  .sub-btn { display: block; width: 100%; border: 2px solid #ddd; background: #fff; border-radius: 14px; font-family: inherit; font-size: 18px; font-weight: bold; padding: 13px; margin-bottom: 9px; cursor: pointer; }
  a.back { display: block; margin: 26px auto 0; max-width: 320px; text-align: center; padding: 15px; border-radius: 16px; background: #555; color: #fff; font-size: 19px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }
</style>

<body>
<div id="timer-bar" style="display:none; position:fixed; top:0; left:0; right:0; z-index:60; background:rgba(90,70,50,.92); color:#fff; text-align:center; font-weight:bold; font-size:18px; padding:9px 4px;">⏰ のこり <span id="timer-bar-time">--:--</span></div>
<div id="time-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; z-index:70; background:rgba(0,0,0,.55); align-items:center; justify-content:center; padding:20px;">
  <div style="background:#fff; border-radius:20px; padding:28px 22px; text-align:center; max-width:340px; width:100%;">
    <div style="font-size:52px;">⏰</div>
    <div id="overlay-text" style="font-size:22px; font-weight:bold; margin:10px 0 18px;">じかん おわり！</div>
    <a href="play.html" style="display:block; background:#8e44ad; color:#fff; border-radius:14px; padding:14px; font-size:19px; font-weight:bold; text-decoration:none;">あそびコーナーへ</a>
  </div>
</div>

<div class="wrap">
  <h1 id="quiz-title">クイズ</h1>

  <div id="level-view"></div>

  <div id="quiz-view" class="hidden">
    <div class="progress" id="progress"></div>
    <img class="q-img hidden" id="q-img" alt="">
    <div class="q-text" id="q-text"></div>
    <div id="choices"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="next-btn hidden" id="next-btn" type="button">つぎへ</button>
  </div>

  <div id="result-view" class="hidden">
    <div class="result-box">
      <div>けっか</div>
      <div class="result-score"><span id="result-score">0</span><span style="font-size:22px;"> / <span id="result-total">10</span> もん</span></div>
      <div class="result-msg" id="result-msg"></div>
      <button class="sub-btn" id="retry-btn" type="button">もういちど</button>
      <button class="sub-btn" id="level-btn" type="button">レベルを えらぶ</button>
    </div>
  </div>

</div>

<script>
  /* ===== 共通タイマー（あそびコーナー） ===== */
  function playEndsAt() {
    try {
      var t = JSON.parse(localStorage.getItem("kidsdrills_playtimer_v1") || "null");
      return (t && t.endsAt) ? t.endsAt : 0;
    } catch (e) { return 0; }
  }
  function fmtRemain(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ":" + ((s % 60) < 10 ? "0" : "") + (s % 60);
  }
  function tickTimer() {
    var e = playEndsAt(), now = Date.now();
    var bar = document.getElementById("timer-bar");
    var ov = document.getElementById("time-overlay");
    if (e && e > now) {
      ov.style.display = "none";
      bar.style.display = "";
      document.getElementById("timer-bar-time").textContent = fmtRemain(e - now);
      document.body.style.paddingTop = "48px";
    } else {
      bar.style.display = "none";
      document.body.style.paddingTop = "";
      ov.style.display = "flex";
      document.getElementById("overlay-text").textContent = e ? "じかん おわり！" : "まず タイマーを セットしてね";
    }
  }
  tickTimer();
  setInterval(tickTimer, 500);

  /* ===== クイズ本体 ===== */
  var META = {
    bird:   { title: "🐦 鳥クイズ",     levels: { 1: "やさしい", 2: "ふつう", 3: "ちょっと むずかしい", 4: "上級", 5: "超上級" } },
    keirin: { title: "🚴 競輪クイズ",   levels: { 1: "やさしい", 2: "ふつう", 3: "むずかしい" } },
    nfl:    { title: "🏈 NFLクイズ",    levels: { 1: "ビギナー", 2: "ファン", 3: "マニア", 4: "超上級" } },
    sumo:   { title: "🏯 大相撲クイズ", levels: { 1: "やさしい", 2: "ふつう", 3: "むずかしい", 4: "上級" } }
  };
  var gameKey = "bird";
  try {
    var g = new URLSearchParams(location.search).get("g");
    if (g && QUIZ_BANKS[g]) gameKey = g;
  } catch (e) {}
  var bank = QUIZ_BANKS[gameKey];
  var meta = META[gameKey];
  document.getElementById("quiz-title").textContent = meta.title;
  document.title = meta.title + " | あそびコーナー";

  /* ===== あそび記録（だれが・どのゲームを・どれくらい） ===== */
  var PLAYLOG_KEY = "kidsdrills_playlog_v1";
  function plLoad() { try { return JSON.parse(localStorage.getItem(PLAYLOG_KEY) || "{}"); } catch (e) { return {}; } }
  function plSave(d) { try { localStorage.setItem(PLAYLOG_KEY, JSON.stringify(d)); } catch (e) {} }
  function plToday() { var d = new Date(); function p(n) { return (n < 10 ? "0" : "") + n; } return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function plEntry(game) {
    var player = "";
    try { player = localStorage.getItem("kidsdrills_last_player") || ""; } catch (e) {}
    if (!player) return null;
    var d = plLoad();
    if (!d[player]) d[player] = {};
    if (!d[player][game]) d[player][game] = { sec: 0, plays: 0, best: null, done: 0, last: "" };
    return { d: d, e: d[player][game] };
  }
  function plBest(game, score) {
    var r = plEntry(game); if (!r) return;
    if (r.e.best === null || score > r.e.best) r.e.best = score;
    r.e.last = plToday();
    plSave(r.d);
  }
  function plDone(game) {
    var r = plEntry(game); if (!r) return;
    r.e.done += 1;
    r.e.last = plToday();
    plSave(r.d);
  }
  var plGame = "quiz-" + gameKey;
  var plStart = Date.now();
  var plCounted = false;
  function plTick() {
    var now = Date.now();
    var add = Math.round((now - plStart) / 1000);
    plStart = now;
    if (add <= 0) return;
    var r = plEntry(plGame); if (!r) return;
    r.e.sec += add;
    if (!plCounted) { r.e.plays += 1; plCounted = true; }
    r.e.last = plToday();
    plSave(r.d);
  }
  setInterval(plTick, 5000);
  window.addEventListener("pagehide", plTick);
  document.addEventListener("visibilitychange", function () { if (document.hidden) plTick(); });

  var state = { lv: 0, qs: [], idx: 0, score: 0 };
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function showLevel() {
    document.getElementById("quiz-view").classList.add("hidden");
    document.getElementById("result-view").classList.add("hidden");
    var lv = document.getElementById("level-view");
    lv.classList.remove("hidden");
    lv.innerHTML = "";
    var lvs = [];
    bank.forEach(function (q) { if (lvs.indexOf(q.lv) < 0) lvs.push(q.lv); });
    lvs.sort();
    lvs.forEach(function (l) {
      var n = bank.filter(function (q) { return q.lv === l; }).length;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lv-btn";
      b.innerHTML = "";
      b.textContent = "レベル" + l + "： " + (meta.levels[l] || "");
      var s = document.createElement("span");
      s.className = "lv-count";
      s.textContent = "（" + n + "もん）";
      b.appendChild(s);
      b.addEventListener("click", function () { startQuiz(l); });
      lv.appendChild(b);
    });
    var all = document.createElement("button");
    all.type = "button";
    all.className = "lv-btn";
    all.textContent = "ミックス（全部から）";
    var s2 = document.createElement("span");
    s2.className = "lv-count";
    s2.textContent = "（" + bank.length + "もん）";
    all.appendChild(s2);
    all.addEventListener("click", function () { startQuiz(0); });
    lv.appendChild(all);
  }
  function startQuiz(lv) {
    state.lv = lv;
    var pool = lv === 0 ? bank : bank.filter(function (q) { return q.lv === lv; });
    state.qs = shuffle(pool).slice(0, 10);
    state.idx = 0;
    state.score = 0;
    document.getElementById("level-view").classList.add("hidden");
    document.getElementById("result-view").classList.add("hidden");
    document.getElementById("quiz-view").classList.remove("hidden");
    renderQuestion();
  }
  function renderQuestion() {
    var q = state.qs[state.idx];
    document.getElementById("progress").textContent = (state.idx + 1) + " / " + state.qs.length + " もんめ　⭐ " + state.score;
    var img = document.getElementById("q-img");
    if (q.img) { img.src = q.img; img.classList.remove("hidden"); }
    else { img.classList.add("hidden"); img.removeAttribute("src"); }
    document.getElementById("q-text").textContent = q.q;
    document.getElementById("feedback").classList.add("hidden");
    document.getElementById("next-btn").classList.add("hidden");
    var box = document.getElementById("choices");
    box.innerHTML = "";
    var order = shuffle(q.c.map(function (_, i) { return i; }));
    order.forEach(function (ci) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.textContent = q.c[ci];
      b.addEventListener("click", function () { answer(b, ci === q.a, q); });
      box.appendChild(b);
    });
  }
  function answer(btn, correct, q) {
    document.querySelectorAll(".choice").forEach(function (b) { b.disabled = true; });
    if (correct) {
      state.score++;
      btn.classList.add("right");
    } else {
      btn.classList.add("wrong");
      document.querySelectorAll(".choice").forEach(function (b) {
        if (b.textContent === q.c[q.a]) b.classList.add("right");
      });
    }
    var fb = document.getElementById("feedback");
    fb.innerHTML = "";
    var mark = document.createElement("div");
    mark.className = "mark";
    mark.textContent = correct ? "⭕ せいかい！" : "❌ ざんねん…";
    mark.style.color = correct ? "#2e9e5b" : "#e05252";
    var ex = document.createElement("div");
    ex.textContent = q.ex || "";
    fb.appendChild(mark);
    fb.appendChild(ex);
    fb.classList.remove("hidden");
    var nb = document.getElementById("next-btn");
    nb.textContent = (state.idx + 1 >= state.qs.length) ? "けっかを みる" : "つぎへ";
    nb.classList.remove("hidden");
  }
  document.getElementById("next-btn").addEventListener("click", function () {
    state.idx++;
    if (state.idx >= state.qs.length) {
      document.getElementById("quiz-view").classList.add("hidden");
      document.getElementById("result-score").textContent = state.score;
      document.getElementById("result-total").textContent = state.qs.length;
      var msg = state.score >= state.qs.length ? "かんぺき！ すごすぎる！！" :
        state.score >= state.qs.length * 0.7 ? "すごい！ よくできました！" :
        state.score >= state.qs.length * 0.4 ? "よく がんばったね！" : "つぎは もっと いけるよ！";
      document.getElementById("result-msg").textContent = msg;
      document.getElementById("result-view").classList.remove("hidden");
      plBest(plGame, state.score);
      plDone(plGame);
    } else {
      renderQuestion();
    }
  });
  document.getElementById("retry-btn").addEventListener("click", function () { startQuiz(state.lv); });
  document.getElementById("level-btn").addEventListener("click", showLevel);
  showLevel();
</script>
