<script>
/* ===== ドリルランド PINゲート（そとがわチェック） =====
   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。
   ドリルを再エクスポートしたら、このスニペットを再適用すること。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=kiroku.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261128-9";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<style>

  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff8e7; color: #333; }

  .backup-box { margin: 36px auto 0; max-width: 480px; background: #fff; border: 2px dashed #cbbfa5; border-radius: 14px; padding: 16px; }

  .backup-btn { display: block; width: 100%; margin-top: 8px; padding: 13px; border: none; border-radius: 12px; background: #5a4632; color: #fff; font-size: 16px; font-weight: bold; text-align: center; cursor: pointer; font-family: inherit; box-sizing: border-box; }
  .backup-msg { font-size: 13px; color: #2e7d32; margin-top: 10px; min-height: 18px; text-align: center; }
  .backup-server { border-top: 1px dashed #e0d5ba; margin-top: 16px; padding-top: 14px; }

<style>
  /* はいけい テーマ（トップで えらぶ・この端末に 保存される） */
  html[data-theme="yuyake"] body{background:linear-gradient(180deg,#ff9d76 0%,#ffc98a 45%,#ffe9c9 100%);background-attachment:fixed;}

<body>
<div class="wrap">
  <h1>きろく</h1>
  <div id="content"></div>
  <div class="backup-box">
    <div class="backup-title">💾 バックアップ（おうちの人用）</div>
    <p class="backup-note">きろく・ふくしゅうリスト・バードの台帳・はいけいの設定を、まとめてファイルに保存できます。データはこのiPadの中にだけあるので、時々ほぞんしておくと安心です。消えてしまったときは「ファイルから もどす」で復元できます。</p>
    <button class="backup-btn" id="export-btn" type="button">ファイルに ほぞん</button>
    <label class="backup-btn">ファイルから もどす<input type="file" id="import-file" accept="application/json,.json" hidden></label>
    <div class="backup-msg" id="backup-msg"></div>
    <div class="backup-server">
      <div class="backup-title" style="font-size:15px;">☁️ サーバー（自動バックアップ）</div>
      <p class="backup-note">トップを開くと、データが家族のスプレッドシートへ自動で送られます。このiPadの名前を選んでおくと、復元のときに使います。復元には PIN が必要です。</p>
      <div class="dev-row">
        <button class="dev-chip" type="button" data-dev="soichiro">そういちろうの iPad</button>
        <button class="dev-chip" type="button" data-dev="tsuzumi">つづみの iPad</button>
        <button class="dev-chip" type="button" data-dev="ipad">その他</button>
      </div>
      <input class="pin-input" id="restore-pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN（4けた）">
      <button class="backup-btn" id="restore-btn" type="button">サーバーから もどす</button>
      <div class="backup-msg" id="restore-msg"></div>
    </div>
  </div>
</div>
<script>
  var SUBJECTS = [
    ["kanji", "かんじ"],
    ["kokugo", "こくご"],
    ["sansuu", "さんすう"],
    ["shakai", "しゃかい"],
    ["rika", "りか"],
    ["eigo", "えいご"]
  ];
  var PLAYERS = [
    ["soichiro", "そういちろう", "soichiro"],
    ["tsuzumi", "つづみ", "tsuzumi"]
  ];
  var data = {};
  try {
    data = JSON.parse(localStorage.getItem("kidsdrills_records_v1") || "{}");
  } catch (e) {
    data = {};
  }
  var html = "";
  function fmtDur(sec) {
    sec = Math.round(sec || 0);
    if (sec <= 0) return "-";
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + "じかん " + m + "ふん";
    if (m > 0) return m + "ふん";
    return s + "びょう";
  }
  PLAYERS.forEach(function (p) {
    var rec = data[p[0]] || {};
    html += '<h2 class="' + p[2] + '">' + p[1] + '</h2>';
    var hasAny = SUBJECTS.some(function (s) { return rec[s[0]] && rec[s[0]].plays > 0; });
    if (!hasAny) {
      html += '<div class="empty">まだ きろくが ありません</div>';
      return;
    }
    var tPlays = 0, tQ = 0, tC = 0, tSec = 0;
    html += '<table><tr><th>きょうか</th><th>やった<br>かいすう</th><th>もんだい<br>すう</th><th>せいかい<br>すう</th><th>せいかい<br>りつ</th><th>さいこう<br>ランク</th><th>じかん</th><th>さいごに<br>やった日</th></tr>';
    SUBJECTS.forEach(function (s) {
      var r = rec[s[0]];
      if (!r || !r.plays) {
        html += '<tr><td class="subj">' + s[1] + '</td><td>0</td><td>0</td><td>0</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>';
        return;
      }
      tPlays += r.plays; tQ += r.questions; tC += r.correct; tSec += (r.seconds || 0);
      var rate = r.questions ? Math.round(r.correct / r.questions * 100) + "%" : "-";
      html += '<tr><td class="subj">' + s[1] + '</td><td>' + r.plays + '</td><td>' + r.questions + '</td><td>' + r.correct + '</td><td>' + rate + '</td><td>' + (r.bestRank || "-") + '</td><td>' + fmtDur(r.seconds) + '</td><td>' + (r.lastPlayed || "-") + '</td></tr>';
    });
    var tRate = tQ ? Math.round(tC / tQ * 100) + "%" : "-";
    html += '<tr class="total"><td class="subj">ぜんぶ</td><td>' + tPlays + '</td><td>' + tQ + '</td><td>' + tC + '</td><td>' + tRate + '</td><td></td><td>' + fmtDur(tSec) + '</td><td></td></tr>';
    html += '</table>';
  });
    document.getElementById("content").innerHTML = html;

  /* ===== あそびの きろく ===== */
  var plog = {};
  try { plog = JSON.parse(localStorage.getItem("kidsdrills_playlog_v1") || "{}"); } catch (e) { plog = {}; }
  var GAMES = [["touch", "ことりタッチ"], ["memory", "しんけいすいじゃく"], ["puzzle", "しゃしんパズル"], ["catch", "えさキャッチ"], ["pop", "ことりポップ"], ["quiz-bird", "鳥クイズ"], ["quiz-keirin", "競輪クイズ"], ["quiz-nfl", "NFLクイズ"], ["quiz-sumo", "大相撲クイズ"]];
  var phtml = '<h2 style="margin-top:30px;">🎮 あそびの きろく</h2>';
  PLAYERS.forEach(function (p) {
    var rec = plog[p[0]] || {};
    phtml += '<h2 class="' + p[2] + '">' + p[1] + '</h2>';
    var has = GAMES.some(function (g) { return rec[g[0]] && rec[g[0]].plays > 0; });
    if (!has) {
      phtml += '<div class="empty">まだ きろくが ありません</div>';
      return;
    }
    var tSec = 0;
    phtml += '<table><tr><th>ゲーム</th><th>やった<br>かいすう</th><th>じかん</th><th>ベスト</th><th>かんせい<br>かいすう</th><th>さいごに<br>やった日</th></tr>';
    GAMES.forEach(function (g) {
      var r = rec[g[0]];
      if (!r || !r.plays) return;
      tSec += (r.sec || 0);
      phtml += '<tr><td class="subj">' + g[1] + '</td><td>' + r.plays + '</td><td>' + fmtDur(r.sec) + '</td><td>' + (r.best === null || r.best === undefined ? "-" : r.best) + '</td><td>' + (r.done || 0) + '</td><td>' + (r.last || "-") + '</td></tr>';
    });
    phtml += '<tr class="total"><td class="subj">ぜんぶ</td><td></td><td>' + fmtDur(tSec) + '</td><td></td><td></td><td></td></tr>';
    phtml += '</table>';
  });
  document.getElementById("content").innerHTML = html + phtml;

  /* ================= バックアップ（書き出し／読み込み） ================= */
  var BACKUP_KEYS = ["kidsdrills_records_v1", "kidsdrills_review_v1", "bird_ledger_v1", "kidsdrills_gacha_v1", "kidsdrills_wallet_v1", "kidsdrills_playlog_v1", "kidsdrills_theme_v1", "kidsdrills_last_player"];
  document.getElementById("export-btn").addEventListener("click", function () {
    var payload = { app: "tadaima-backup", version: 1, exportedAt: new Date().toISOString(), data: {} };
    BACKUP_KEYS.forEach(function (k) {
      var v = null;
      try { v = localStorage.getItem(k); } catch (e) {}
      if (v !== null) payload.data[k] = v;
    });
    var blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    var d = new Date();
    var mm = ("0" + (d.getMonth() + 1)).slice(-2), dd = ("0" + d.getDate()).slice(-2);
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tadaima-backup-" + d.getFullYear() + mm + dd + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    document.getElementById("backup-msg").textContent = "ほぞんしました。「ファイル」アプリのダウンロードに入っています。";
  });
  document.getElementById("import-file").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var msg = document.getElementById("backup-msg");
      try {
        var payload = JSON.parse(reader.result);
        if (!payload || payload.app !== "tadaima-backup" || !payload.data) throw new Error("bad file");
        var n = 0;
        BACKUP_KEYS.forEach(function (k) {
          if (typeof payload.data[k] === "string") { localStorage.setItem(k, payload.data[k]); n++; }
        });
        if (!n) throw new Error("empty");
        msg.textContent = "もどしました。ページを ひらきなおします。";
        setTimeout(function () { location.reload(); }, 900);
      } catch (e) {
        msg.textContent = "このファイルでは もどせませんでした。";
      }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  /* ================= サーバー復元（自動バックアップから） ================= */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbyurtmUMcRCv2MmyBu96IlMEbBIpReYApm1QwtaI52hEh1JWn_fK4BrMhHgDkhszmZIBg/exec";
  function resolvedDevice() {
    var d = null;
    try { d = localStorage.getItem("kidsdrills_device_v1"); } catch (e) {}
    if (d) return d;
    var p = null;
    try { p = localStorage.getItem("kidsdrills_last_player"); } catch (e) {}
    return (p === "soichiro" || p === "tsuzumi") ? p : "ipad";
  }
  function paintDevChips() {
    var d = resolvedDevice();
    document.querySelectorAll(".dev-chip").forEach(function (c) {
      c.classList.toggle("sel", c.getAttribute("data-dev") === d);
    });
  }
  document.querySelectorAll(".dev-chip").forEach(function (c) {
    c.addEventListener("click", function () {
      try { localStorage.setItem("kidsdrills_device_v1", c.getAttribute("data-dev")); } catch (e) {}
      paintDevChips();
    });
  });
  paintDevChips();
  document.getElementById("restore-btn").addEventListener("click", function () {
    var pin = document.getElementById("restore-pin").value.replace(/\s+/g, "");
    var msg = document.getElementById("restore-msg");
    if (!pin) { msg.textContent = "PINを 入れてね。"; return; }
    msg.textContent = "サーバーに きいています…";
    fetch(ENDPOINT + "?action=restore&device=" + encodeURIComponent(resolvedDevice()) + "&pin=" + encodeURIComponent(pin))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok || !j.payload) { msg.textContent = "もどせませんでした（PINか、バックアップの有無を確認してね）。"; return; }
        var payload = JSON.parse(j.payload);
        if (!payload || !payload.data) { msg.textContent = "もどせませんでした。"; return; }
        var n = 0;
        BACKUP_KEYS.forEach(function (k) {
          if (typeof payload.data[k] === "string") { localStorage.setItem(k, payload.data[k]); n++; }
        });
        if (!n) { msg.textContent = "もどすデータが ありませんでした。"; return; }
        msg.textContent = "もどしました（" + (j.updatedAt || "") + " のバックアップ）。ページを ひらきなおします。";
        setTimeout(function () { location.reload(); }, 1200);
      })
      .catch(function () { msg.textContent = "つうしんに 失敗しました。"; });
  });
</script>
