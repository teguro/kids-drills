<!DOCTYPE html>
<html lang="ja">
<head>
<script>
/* ===== ドリルランド PINゲート（そとがわチェック） ===== */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=toripike.html");
})();
</script>
<script>
/* ===== バージョンチェック ===== */
(function () {
  var SITE_VERSION = "20261128-15";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とりぴけ | ただいま</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff6e8; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 90px; }
  h1 { font-size: 26px; text-align: center; margin: 6px 0 4px; line-height: 1.4; }
  .sub { text-align: center; color: #777; font-size: 15px; margin: 0 0 16px; line-height: 1.6; }
  .card { background: #fff; border-radius: 20px; padding: 18px 16px; margin-top: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .card h2 { font-size: 20px; margin: 0 0 8px; }
  .ep-title { font-size: 19px; font-weight: bold; line-height: 1.5; }
  .ep-date { color: #999; font-size: 14px; margin-top: 2px; }
  audio { width: 100%; margin-top: 14px; height: 48px; }
  .shuffle-btn { display: block; width: 100%; font-family: inherit; font-size: 21px; font-weight: bold; color: #fff; background: linear-gradient(180deg, #4aa3e0, #2e7cb8); border: none; border-radius: 16px; padding: 16px 14px; margin-top: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); touch-action: manipulation; }
  .shuffle-btn:active { transform: translateY(3px); box-shadow: none; }
  .shuffle-btn.on { background: linear-gradient(180deg, #43a35f, #2e7d4f); }
  .next-btn { display: block; width: 100%; font-family: inherit; font-size: 18px; font-weight: bold; color: #333; background: #fdf1dc; border: 2px solid #e8dcc0; border-radius: 14px; padding: 13px 14px; margin-top: 10px; cursor: pointer; touch-action: manipulation; }
  .ep-btn { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 16px; font-weight: bold; color: #333; background: #fdf6e3; border: 2px solid #e8dcc0; border-radius: 14px; padding: 12px 14px; margin-top: 9px; cursor: pointer; touch-action: manipulation; line-height: 1.5; }
  .ep-btn .d { display: block; font-size: 13px; font-weight: normal; color: #999; margin-top: 2px; }
  .ep-btn.on { background: #cfe8fb; border-color: #4aa3e0; }
  .ep-btn .new { display: inline-block; background: #e4572e; color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }
  .msg { font-size: 15px; color: #c0392b; min-height: 1.2em; margin: 10px 0 0; }
  .count { color: #999; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔭 とりぴけの野鳥観察＆撮影ラジオ</h1>
  <p class="sub">野鳥の 観察と 撮影の お話。<br>身近な 鳥の 見つけ方や 季節の 鳥の 話が 多いよ（1回 10分くらい）。</p>

  <div class="card">
    <h2>▶️ きく</h2>
    <div class="ep-title" id="ep-title">下から えらぶか、ランダムで きいてね</div>
    <div class="ep-date" id="ep-date"></div>
    <audio id="player" controls preload="none" playsinline></audio>
    <button class="next-btn" id="next-btn" type="button" style="display:none;">⏭ つぎの ランダムへ</button>
    <p class="msg" id="play-msg"></p>
  </div>

  <div class="card">
    <h2>📚 かこの 回</h2>
    <button class="shuffle-btn" id="shuffle-btn" type="button">🎲 ランダムで きく</button>
    <p class="count" id="count">よみこみ中…</p>
    <div id="list"></div>
  </div>
</div>

<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyurtmUMcRCv2MmyBu96IlMEbBIpReYApm1QwtaI52hEh1JWn_fK4BrMhHgDkhszmZIBg/exec';
var BOARD_PIN = '2002';
var eps = [];
var currentIdx = -1;
var shuffle = false;
var recent = [];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function playEpisode(idx, play) {
  var ep = eps[idx];
  if (!ep) return;
  currentIdx = idx;
  recent.push(idx);
  if (recent.length > 30) recent.shift();
  var btns = $('list').children;
  for (var k = 0; k < btns.length; k++) btns[k].className = btns[k].className.replace(' on', '');
  var btn = $('list').querySelector('[data-idx="' + idx + '"]');
  if (btn) btn.className += ' on';
  $('ep-title').textContent = ep.title;
  $('ep-date').textContent = ep.dateText || '';
  $('play-msg').textContent = '';
  var player = $('player');
  player.src = ep.url;
  if (play) {
    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
  }
}

function pickRandom() {
  if (!eps.length) return -1;
  var pool = [];
  for (var i = 0; i < eps.length; i++) {
    if (recent.indexOf(i) < 0) pool.push(i);
  }
  if (!pool.length) pool = eps.map(function (_, i) { return i; });
  return pool[Math.floor(Math.random() * pool.length)];
}

function setShuffle(on) {
  shuffle = on;
  $('shuffle-btn').className = $('shuffle-btn').className.replace(' on', '') + (on ? ' on' : '');
  $('next-btn').style.display = on ? 'block' : 'none';
}

$('shuffle-btn').addEventListener('click', function () {
  if (shuffle) { setShuffle(false); return; }
  if (!eps.length) return;
  setShuffle(true);
  playEpisode(pickRandom(), true);
});
$('next-btn').addEventListener('click', function () {
  if (shuffle) playEpisode(pickRandom(), true);
});
$('player').addEventListener('ended', function () {
  if (shuffle) playEpisode(pickRandom(), true);
});
$('player').addEventListener('error', function () {
  if (currentIdx >= 0) {
    $('play-msg').textContent = 'うまく 再生できなかった…ネットが つながっているか たしかめてね';
  }
}, true);

function renderList() {
  var list = $('list');
  list.innerHTML = '';
  eps.forEach(function (ep, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn' + (currentIdx === i ? ' on' : '');
    b.setAttribute('data-idx', i);
    b.innerHTML = esc(ep.title) + (i === 0 ? '<span class="new">さいしん</span>' : '') +
      '<span class="d">' + esc(ep.dateText) + '</span>';
    b.addEventListener('click', function () { setShuffle(false); playEpisode(i, true); });
    list.appendChild(b);
  });
  $('count').textContent = 'ぜんぶで ' + eps.length + '回';
}

fetch(ENDPOINT + '?action=yasashii&pin=' + encodeURIComponent(BOARD_PIN))
  .then(function (r) { return r.json(); })
  .then(function (j) {
    eps = ((j && j.toripike) || []).map(function (ep) {
      return { title: ep.title || 'とりぴけ', dateText: ep.onair || '', url: ep.stream || '' };
    }).filter(function (ep) { return ep.url; });
    if (eps.length) renderList();
    else $('count').textContent = 'いまは よみこめなかった…あとで また ためしてね';
  })
  .catch(function () {
    $('count').textContent = 'いまは よみこめなかった…あとで また ためしてね';
  });
</script>
