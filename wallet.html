<script>
/* ===== ドリルランド PINゲート（そとがわチェック） =====
   きょう開錠していなければ入口（index.html）へもどす。くわしくは GATE.md。 */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=wallet.html");
})();
</script>
<script>
/* ===== バージョンチェック：新しい版が出ていたら自動で最新を取り直す =====
   version.json をキャッシュなしで確認し、版が違えば URL を変えて読み直す。
   公開のたびに SITE_VERSION と version.json を同じ値に上げること（GATE.md 参照）。 */
(function () {
  var SITE_VERSION = "20261128-7";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

  .memo-chip { border: 2px solid #ddd; background: #fff; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: bold; padding: 7px 13px; cursor: pointer; }
  .memo-chip.sel { border-color: #e89b1c; background: #fdf1dc; }
  .memo-input { width: 100%; font-family: inherit; font-size: 16px; padding: 11px; border: 2px solid #e8dcc2; border-radius: 12px; margin-bottom: 12px; }
  .add-btn { display: block; width: 100%; border: none; border-radius: 16px; background: #2e9e5b; color: #fff; font-family: inherit; font-size: 22px; font-weight: bold; padding: 16px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); }

  .add-btn.out { background: #e05252; }
  h2 { font-size: 20px; margin: 20px 0 10px; }
  .entry { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); padding: 10px 12px; margin-bottom: 8px; }
  .entry .e-date { font-size: 12px; color: #999; white-space: nowrap; }
  .entry .e-memo { flex: 1; font-size: 16px; font-weight: bold; word-break: break-all; }
  .entry .e-amt { font-size: 18px; font-weight: bold; white-space: nowrap; }
  .entry .e-amt.in { color: #2e9e5b; }
  .entry .e-amt.out { color: #e05252; }
  .entry .e-del { border: none; background: #f3f3f3; color: #999; border-radius: 8px; font-size: 14px; padding: 6px 9px; cursor: pointer; font-family: inherit; }
  .empty { text-align: center; color: #999; background: #fff; border-radius: 12px; padding: 20px; }
  a.back { display: block; margin: 30px auto 0; max-width: 320px; text-align: center; padding: 16px; border-radius: 16px; background: #555; color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
  .hidden { display: none !important; }
</style>

<style>
  /* はいけい テーマ（トップで えらぶ・この端末に 保存される） */
  html[data-theme="yuyake"] body{background:linear-gradient(180deg,#ff9d76 0%,#ffc98a 45%,#ffe9c9 100%);background-attachment:fixed;}

<body>
<div class="wrap">
  <h1>👛 おさいふ</h1>
  <div class="sub">おこづかいの げんきんを きろくするよ。<br>もらったとき・つかったときに 入れてね。</div>

  <div class="player-row">
    <button class="player-btn" id="player-soichiro" type="button">そういちろう</button>
    <button class="player-btn" id="player-tsuzumi" type="button">つづみ</button>
  </div>

  <div class="balance-box">
    <div class="balance-label">いまの おかね</div>
    <div class="balance-num"><span id="balance-num">0</span><span style="font-size:22px;"> 円</span></div>
  </div>
  <div class="month-line" id="month-line"></div>

  <div class="entry-box">
    <div class="io-row">
      <button class="io-btn sel-in" id="io-in" type="button">💰 もらった</button>
      <button class="io-btn" id="io-out" type="button">🛒 つかった</button>
    </div>
    <div class="amount-view"><span id="amount-view">0</span> <span class="yen">円</span></div>
    <div class="pad" id="pad"></div>
    <div class="quick-row">
      <button class="quick-btn" type="button" data-add="100">+100</button>
      <button class="quick-btn" type="button" data-add="500">+500</button>
      <button class="quick-btn" type="button" data-add="1000">+1000</button>
    </div>
    <div class="memo-row" id="memo-row"></div>
    <input class="memo-input" id="memo-input" type="text" placeholder="メモ（じゆうに かいても いいよ）" maxlength="30">
    <button class="add-btn" id="add-btn" type="button">きろくする</button>
  </div>

  <h2>さいきんの きろく</h2>
  <div id="entries"></div>

</div>

<script>
  var WALLET_KEY = "kidsdrills_wallet_v1";
  var MEMOS_IN = ["おこづかい", "バード かんきん", "おとしだま", "おてつだい", "プレゼント"];
  var MEMOS_OUT = ["おかし", "ジュース", "本・まんが", "おもちゃ", "ゲーム", "ぶんぼうぐ"];
  var currentPlayer = null;
  try {
    var lp = localStorage.getItem("kidsdrills_last_player");
    if (lp === "soichiro" || lp === "tsuzumi") currentPlayer = lp;
  } catch (e) {}
  if (!currentPlayer) currentPlayer = "soichiro";

  var ioType = "in";
  var amountStr = "";
  var memoSel = "";

  function loadWallet() {
    try {
      var w = JSON.parse(localStorage.getItem(WALLET_KEY) || "{}");
      return (w && typeof w === "object") ? w : {};
    } catch (e) { return {}; }
  }
  function myEntries() {
    var w = loadWallet();
    if (!Array.isArray(w[currentPlayer])) w[currentPlayer] = [];
    return w;
  }
  function balanceOf(entries) {
    var bal = 0;
    entries.forEach(function (e) { bal += (e.type === "in" ? e.amount : -e.amount); });
    return bal;
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function renderMemos() {
    var row = document.getElementById("memo-row");
    row.innerHTML = "";
    (ioType === "in" ? MEMOS_IN : MEMOS_OUT).forEach(function (m) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "memo-chip" + (memoSel === m ? " sel" : "");
      b.textContent = m;
      b.addEventListener("click", function () {
        memoSel = (memoSel === m) ? "" : m;
        document.getElementById("memo-input").value = "";
        renderMemos();
      });
      row.appendChild(b);
    });
  }
  function render() {
    document.getElementById("player-soichiro").className = "player-btn" + (currentPlayer === "soichiro" ? " sel-soichiro" : "");
    document.getElementById("player-tsuzumi").className = "player-btn" + (currentPlayer === "tsuzumi" ? " sel-tsuzumi" : "");
    var w = myEntries();
    var entries = w[currentPlayer];
    document.getElementById("balance-num").textContent = fmt(balanceOf(entries));
    var now = new Date();
    var ym = now.getFullYear() + "-" + ("0" + (now.getMonth() + 1)).slice(-2);
    var mIn = 0, mOut = 0;
    entries.forEach(function (e) {
      if (e.date.indexOf(ym) === 0) { if (e.type === "in") mIn += e.amount; else mOut += e.amount; }
    });
    document.getElementById("month-line").textContent = "今月： もらった " + fmt(mIn) + "円 ／ つかった " + fmt(mOut) + "円";
    document.getElementById("io-in").className = "io-btn" + (ioType === "in" ? " sel-in" : "");
    document.getElementById("io-out").className = "io-btn" + (ioType === "out" ? " sel-out" : "");
    document.getElementById("add-btn").className = "add-btn" + (ioType === "out" ? " out" : "");
    document.getElementById("amount-view").textContent = fmt(amountStr === "" ? 0 : parseInt(amountStr, 10));
    var box = document.getElementById("entries");
    box.innerHTML = "";
    if (entries.length === 0) {
      box.innerHTML = '<div class="empty">まだ きろくが ありません</div>';
      return;
    }
    entries.slice().reverse().slice(0, 40).forEach(function (e) {
      var div = document.createElement("div");
      div.className = "entry";
      var d = document.createElement("span");
      d.className = "e-date";
      d.textContent = e.date.slice(5).replace("-", "/");
      var m = document.createElement("span");
      m.className = "e-memo";
      m.textContent = e.memo || (e.type === "in" ? "もらった" : "つかった");
      var a = document.createElement("span");
      a.className = "e-amt " + e.type;
      a.textContent = (e.type === "in" ? "+" : "−") + fmt(e.amount) + "円";
      var del = document.createElement("button");
      del.type = "button";
      del.className = "e-del";
      del.textContent = "けす";
      del.addEventListener("click", function () {
        if (!confirm("この きろくを けしますか？")) return;
        var w2 = myEntries();
        w2[currentPlayer] = w2[currentPlayer].filter(function (x) { return x.id !== e.id; });
        try { localStorage.setItem(WALLET_KEY, JSON.stringify(w2)); } catch (err) {}
        render();
      });
      div.appendChild(d); div.appendChild(m); div.appendChild(a); div.appendChild(del);
      box.appendChild(div);
    });
  }
  /* テンキー */
  var pad = document.getElementById("pad");
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "00", "0", "けす"].forEach(function (k) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pad-key";
    b.textContent = k;
    b.addEventListener("click", function () {
      if (k === "けす") amountStr = amountStr.slice(0, -1);
      else {
        if (amountStr.length >= 7) return;
        amountStr += k;
        amountStr = amountStr.replace(/^0+(?=\d)/, "");
      }
      render();
    });
    pad.appendChild(b);
  });
  document.querySelectorAll(".quick-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      var cur = amountStr === "" ? 0 : parseInt(amountStr, 10);
      amountStr = String(Math.min(9999999, cur + parseInt(b.getAttribute("data-add"), 10)));
      render();
    });
  });
  document.getElementById("io-in").addEventListener("click", function () { ioType = "in"; memoSel = ""; document.getElementById("memo-input").value = ""; renderMemos(); render(); });
  document.getElementById("io-out").addEventListener("click", function () { ioType = "out"; memoSel = ""; document.getElementById("memo-input").value = ""; renderMemos(); render(); });
  document.getElementById("add-btn").addEventListener("click", function () {
    var amount = amountStr === "" ? 0 : parseInt(amountStr, 10);
    if (!amount || amount <= 0) { alert("きんがくを 入れてね"); return; }
    var memo = document.getElementById("memo-input").value.replace(/^\s+|\s+$/g, "") || memoSel;
    var w = myEntries();
    w[currentPlayer].push({ id: Date.now() + "-" + Math.floor(Math.random() * 100000), date: todayStr(), type: ioType, amount: amount, memo: memo });
    try { localStorage.setItem(WALLET_KEY, JSON.stringify(w)); } catch (e) {}
    amountStr = "";
    memoSel = "";
    document.getElementById("memo-input").value = "";
    renderMemos();
    render();
  });
  ["soichiro", "tsuzumi"].forEach(function (p) {
    document.getElementById("player-" + p).addEventListener("click", function () {
      currentPlayer = p;
      try { localStorage.setItem("kidsdrills_last_player", p); } catch (e) {}
      amountStr = "";
      render();
    });
  });
  renderMemos();
  render();
</script>
