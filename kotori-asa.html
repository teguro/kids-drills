<html lang="ja">
<head>
<script>
/* ===== ドリルランド PINゲート（そとがわチェック） ===== */
(function () {
  function todayStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var ok = false;
  try { ok = localStorage.getItem("land_unlock_v1") === todayStr(); } catch (e) { ok = false; }
  if (!ok) location.replace("index.html?next=kotori-asa.html");
})();
</script>
<script>
/* ===== バージョンチェック ===== */
(function () {
  var SITE_VERSION = "20261128-16";
  function alreadyTried() {
    try { return new URLSearchParams(location.search).get("_v") === SITE_VERSION; }
    catch (e) { return false; }
  }
  if (alreadyTried()) return;
  fetch("version.json?x=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.version || j.version === SITE_VERSION) return;
      var key = "sitever_try_" + j.version;
      var n = 0;
      try {
        n = parseInt(sessionStorage.getItem(key) || "0", 10) || 0;
        if (n >= 2) return;
        sessionStorage.setItem(key, String(n + 1));
      } catch (e) {}
      location.replace(location.pathname + "?_v=" + encodeURIComponent(j.version));
    })
    .catch(function () {});
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朝の小鳥 | ただいま</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; background: #fff6e8; color: #333; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 90px; }
  h1 { font-size: 28px; text-align: center; margin: 6px 0 4px; }
  .sub { text-align: center; color: #777; font-size: 15px; margin: 0 0 16px; line-height: 1.6; }
  .card { background: #fff; border-radius: 20px; padding: 18px 16px; margin-top: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .card h2 { font-size: 20px; margin: 0 0 8px; }
  .ep-title { font-size: 19px; font-weight: bold; line-height: 1.5; }
  .ep-date { color: #999; font-size: 14px; margin-top: 2px; }
  .ep-desc { font-size: 15px; color: #555; line-height: 1.7; margin-top: 8px; }
  audio { width: 100%; margin-top: 14px; height: 48px; }
  .shuffle-btn { display: block; width: 100%; font-family: inherit; font-size: 21px; font-weight: bold; color: #fff; background: linear-gradient(180deg, #f5a54c, #e2703a); border: none; border-radius: 16px; padding: 16px 14px; margin-top: 12px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); touch-action: manipulation; }
  .shuffle-btn:active { transform: translateY(3px); box-shadow: none; }
  .shuffle-btn.on { background: linear-gradient(180deg, #43a35f, #2e7d4f); }
  .skip-btn, .next-btn { display: block; width: 100%; font-family: inherit; font-size: 18px; font-weight: bold; color: #333; background: #fdf1dc; border: 2px solid #e8dcc0; border-radius: 14px; padding: 13px 14px; margin-top: 10px; cursor: pointer; touch-action: manipulation; }
  .skip-btn { background: #ffe9c9; border-color: #f0c98a; }
  .search { width: 100%; font-family: inherit; font-size: 18px; padding: 13px 14px; border: 2px solid #e8dcc0; border-radius: 14px; background: #fffdf6; margin-top: 10px; }
  .ep-btn { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 16px; font-weight: bold; color: #333; background: #fdf6e3; border: 2px solid #e8dcc0; border-radius: 14px; padding: 12px 14px; margin-top: 9px; cursor: pointer; touch-action: manipulation; line-height: 1.5; }
  .ep-btn .d { display: block; font-size: 13px; font-weight: normal; color: #999; margin-top: 2px; }
  .ep-btn.on { background: #ffe3b3; border-color: #f0a04b; }
  .ep-btn .new { display: inline-block; background: #e4572e; color: #fff; font-size: 12px; border-radius: 999px; padding: 2px 9px; margin-left: 8px; vertical-align: 2px; }
  .msg { font-size: 15px; color: #c0392b; min-height: 1.2em; margin: 10px 0 0; }
  .count { color: #999; font-size: 14px; margin-top: 10px; }
  .fallback-btn { display: block; text-align: center; padding: 14px; border-radius: 14px; background: #2e7de4; color: #fff; font-size: 16px; font-weight: bold; text-decoration: none; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐦 朝の小鳥</h1>
  <p class="sub">文化放送の ポッドキャスト。<br>にっぽん中・世界中の とりの こえ（1回 5分くらい）。</p>

  <div class="card">
    <h2>▶️ きく</h2>
    <div class="ep-title" id="ep-title">下から えらぶか、ランダムで きいてね</div>
    <div class="ep-date" id="ep-date"></div>
    <div class="ep-desc" id="ep-desc"></div>
    <audio id="player" controls preload="none" playsinline></audio>
    <button class="skip-btn" id="skip-btn" type="button">⏩ 40秒 すすむ（さいしょの CMを とばす）</button>
    <button class="next-btn" id="next-btn" type="button" style="display:none;">⏭ つぎの ランダムへ</button>
    <p class="msg" id="play-msg"></p>
  </div>

  <div class="card">
    <h2>📚 かこの 回</h2>
    <button class="shuffle-btn" id="shuffle-btn" type="button">🎲 ランダムで きく</button>
    <input class="search" id="search" type="search" placeholder="🔍 とりの なまえ・ばしょ（例：ツグミ、北海道）">
    <p class="count" id="count">よみこみ中…</p>
    <div id="list"></div>
    <a class="fallback-btn" href="https://podcastqr.joqr.co.jp/programs/kotori" target="_blank" rel="noopener">文化放送の ページで みる</a>
  </div>
</div>

<script>
var KOTORI_FEED = 'https://feeds.megaphone.fm/NCB6602326930';
var eps = [];
var currentIdx = -1;
var shuffle = false;
var recent = [];

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtDate(d) {
  if (!d || isNaN(d.getTime())) return '';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function stripHtml(s, n) {
  var t = String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}

function playEpisode(idx, play) {
  var ep = eps[idx];
  if (!ep) return;
  currentIdx = idx;
  recent.push(idx);
  if (recent.length > 30) recent.shift();
  var btns = $('list').children;
  for (var k = 0; k < btns.length; k++) btns[k].className = btns[k].className.replace(' on', '');
  var btn = $('list').querySelector('[data-idx="' + idx + '"]');
  if (btn) btn.className += ' on';
  $('ep-title').textContent = ep.title;
  $('ep-date').textContent = ep.dateText || '';
  $('ep-desc').textContent = ep.desc || '';
  $('play-msg').textContent = '';
  var player = $('player');
  player.src = ep.url;
  if (play) {
    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
  }
}

function pickRandom() {
  if (!eps.length) return -1;
  var pool = [];
  for (var i = 0; i < eps.length; i++) {
    if (recent.indexOf(i) < 0) pool.push(i);
  }
  if (!pool.length) pool = eps.map(function (_, i) { return i; });
  return pool[Math.floor(Math.random() * pool.length)];
}

function setShuffle(on) {
  shuffle = on;
  $('shuffle-btn').className = $('shuffle-btn').className.replace(' on', '') + (on ? ' on' : '');
  $('next-btn').style.display = on ? 'block' : 'none';
}

$('shuffle-btn').addEventListener('click', function () {
  if (shuffle) { setShuffle(false); return; }
  if (!eps.length) return;
  setShuffle(true);
  playEpisode(pickRandom(), true);
});
$('next-btn').addEventListener('click', function () {
  if (shuffle) playEpisode(pickRandom(), true);
});
$('skip-btn').addEventListener('click', function () {
  var p = $('player');
  if (!p.src) return;
  try { p.currentTime = Math.min((p.currentTime || 0) + 40, (p.duration || 1e9) - 1); } catch (e) {}
});
$('player').addEventListener('ended', function () {
  if (shuffle) playEpisode(pickRandom(), true);
});
$('player').addEventListener('error', function () {
  if (currentIdx >= 0) {
    $('play-msg').textContent = 'うまく 再生できなかった…ネットが つながっているか たしかめてね';
  }
}, true);

function renderList(filter) {
  var list = $('list');
  list.innerHTML = '';
  var shown = 0;
  eps.forEach(function (ep, i) {
    if (filter && ep.title.indexOf(filter) < 0 && (ep.desc || '').indexOf(filter) < 0) return;
    shown++;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ep-btn' + (currentIdx === i ? ' on' : '');
    b.setAttribute('data-idx', i);
    b.innerHTML = esc(ep.title) + (i === 0 ? '<span class="new">さいしん</span>' : '') +
      '<span class="d">' + esc(ep.dateText) + '</span>';
    b.addEventListener('click', function () { setShuffle(false); playEpisode(i, true); });
    list.appendChild(b);
  });
  $('count').textContent = 'ぜんぶで ' + eps.length + '回' + (filter ? '（' + shown + '回 みつかった）' : '');
  if (!shown && eps.length) {
    list.innerHTML = '<p style="color:#999;font-size:15px;">みつからなかった… ちがう ことばで さがしてみてね</p>';
  }
}
$('search').addEventListener('input', function () { renderList($('search').value.trim()); });

fetch(KOTORI_FEED)
  .then(function (r) { return r.text(); })
  .then(function (xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    var items = doc.querySelectorAll('item');
    var out = [];
    items.forEach(function (it) {
      var enc = it.querySelector('enclosure');
      if (!enc || !enc.getAttribute('url')) return;
      var d = new Date((it.querySelector('pubDate') || {}).textContent || '');
      out.push({
        title: (it.querySelector('title') || {}).textContent || '朝の小鳥',
        dateText: fmtDate(d),
        url: enc.getAttribute('url'),
        desc: stripHtml((it.querySelector('description') || {}).textContent || '', 160)
      });
    });
    eps = out;
    if (!eps.length) throw new Error('no episodes');
    renderList('');
  })
  .catch(function () {
    $('count').textContent = 'よみこめなかった…ネットが つながらないかも';
  });
</script>
<a id="float-back" href="kotori.html" style="position:fixed;right:14px;bottom:14px;z-index:500;background:#ffffff;border:2px solid #8a8a8a;color:#333333;padding:10px 18px;border-radius:999px;font-size:16px;font-weight:bold;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.25);opacity:0.96;">← もどる</a>
</body>
